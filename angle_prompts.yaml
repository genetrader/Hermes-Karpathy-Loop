# Karpathy Loop -- PROMPT layer under each angle.
#
# A PROMPT is a full work order for ONE round. The angle says WHAT KIND of
# problem to hunt; the prompt says where to look, what to produce, and how to
# leave cleanly when the repo does not have that shape.
#
# Written for disparate repos: each prompt is SPECIFIC about its target but
# SELF-ASSESSING about applicability. A prompt that does not fit is meant to be
# consumed in ~30 seconds with a clean "not applicable" -- never shoehorned.
#
# Fields:
#   applies_when   the precondition, checkable in seconds before any editing
#   hunt           what to look for, with concrete cross-language tells
#   evidence       the exact artifact the round must produce to count as done
#   not_applicable the clean exit: say so, cite why, consume, stop
#
# 4 prompts per angle. Cycle is PER REPO and consumes on attempt.

version: 1
updated: "2026-09-27"

angles:

  # ======================================================================
  # CORRECTNESS
  # ======================================================================
  lying-test:
    - id: lying-test.1
      applies_when: |
        The repo has a test suite with at least a handful of test files, and at
        least some tests are expected to assert on behaviour (not just smoke-run).
      hunt: |
        Find tests whose body cannot fail. Open every test and ask: if the code
        under test were deleted or returned garbage, would this test go red?
        Hunt specifically for: bodies with no assertion at all; assertions that
        compare a value to itself; asserting on a mock's configured return
        instead of the real result; "assert result is not None" as the only
        check; try/except around the call that swallows the failure into a pass.
        Cross-language tells: pytest/unittest with no assert, jest without
        expect(), JUnit without assert*, go test funcs that only call the
        function, a C test that only checks the process exited 0.
      evidence: |
        A table of suspect tests as file:line, and for EACH one exactly one of:
        (a) an assertion added that would fail if the behaviour regressed,
        (b) the test deleted with one line saying what coverage replaced it,
        (c) a written justification for keeping it, naming what it does verify.
        Show the new assertion failing against a deliberately broken build, or
        state plainly that you could not prove it and why.
      not_applicable: |
        No test framework, or no test files. One prompt like this proves it: say
        "not applicable -- repo has no test suite", cite the absence, stop.

    - id: lying-test.2
      applies_when: |
        Tests exist AND the suite reports skips, xfails, or conditional
        exclusions.
      hunt: |
        Find disabled tests that are hiding real breakage. A skip is a promise
        someone made and never kept. Look for: skip/xfail markers with no
        reason string; skips left after the original bug was fixed; exclusions
        that would pass today if re-enabled; whole test files renamed so the
        runner ignores them (test_x.py -> x_test_old.py, _test excluded by
        config); platform/version guards broader than they need to be.
        Cross-language tells: @pytest.mark.skip, t.Skip(), it.skip, @Ignore,
        #if 0, DISABLED_ prefixes, directory names the runner never globs.
      evidence: |
        The list of disabled tests (file:line + the skip reason as written), and
        for each: the result of actually re-enabling it. If it passes, land it
        enabled and say so. If it genuinely fails, name the failure in one line
        and leave the skip in place with that reason written into the marker.
      not_applicable: |
        The suite has no skipped or excluded tests. Say so, cite the grep you
        ran, stop.

    - id: lying-test.3
      applies_when: |
        Tests exist and the code under test has multiple execution paths (error
        handling, branches, or conditionals).
      hunt: |
        Find paths that tests claim to cover but never execute. Look for tests
        named after a failure mode ("test_rejects_bad_input") whose body never
        reaches the rejection branch; mocks stubbed so aggressively the branch
        cannot fire; assertions placed before the call that would trigger the
        path; coverage numbers that include setup/teardown so real coverage is
        lower than reported. Read the test and the code side by side and ask
        which lines the test actually reaches.
      evidence: |
        One concrete case: the test file:line, the code branch it claims to
        cover but does not, and proof of the gap (a debug print, a coverage
        report for that exact file, or the branch inverted to show the test
        still passes). Then either fix the test to reach the branch, or delete
        the claim. State which you chose and why.
      not_applicable: |
        The code under test has no branching OR there are no tests exercising
        it. Say so and how you checked, stop.

    - id: lying-test.4
      applies_when: |
        The repo has snapshot, golden-file, or recorded-fixture tests (or any
        test that compares against a stored artifact).
      hunt: |
        Find recorded artifacts that were regenerated to make a failure go away
        instead of the bug being fixed. Look for: snapshot files whose update
        commit touched no production code; golden files that encode obviously
        wrong output (empty, placeholder, an error string); fixtures captured
        from the buggy path; a --update-snapshot / --record flag in the CI
        config where it should never appear. Cross-language tells: __snapshots__
        dirs, .approved.txt / .received.txt pairs, golden/ and fixtures/ dirs.
      evidence: |
        The snapshot/fixture file plus the commit that last changed it, and the
        verdict: does the recorded value represent correct behaviour, or is it a
        photograph of a bug? If it is a bug, land the corrected value AND the
        code fix together; if it is correct, say why in one line. Cite the
        file:line you based this on.
      not_applicable: |
        No snapshot, golden-file, or recorded-fixture tests exist. Name what you
        searched for, stop.

  swallowed-exception:
    - id: swallowed-exception.1
      applies_when: |
        The language has exceptions, panics, or error returns that can be
        discarded (Python, JS/TS, Java, Ruby, Go, C#). A language with no such
        mechanism is not applicable.
      hunt: |
        Find error signals caught and dropped on the floor. The decisive test:
        if this operation fails, will anyone ever know? Look for bare except:/
        catch {} with pass or empty body; except that only logs at debug; catch
        that returns a default (None, [], 0, false) as if the operation had
        succeeded; try/finally with no except around risky IO. Language-tells:
        Go's "_ = err" and "if err != nil {}"; Rust's let _ = on a Result;
        JS's catch(e) {} and .catch(() => {}).
      evidence: |
        file:line for each discarded error, one line naming the class of failure
        it hides, and a narrowed except (specific exception types) or a
        re-raise/return that surfaces it. Include the test proving it now
        surfaces: the failure made visible where before it was silent.
      not_applicable: |
        No catchable error mechanism, or every error path already surfaces. Say
        which, cite a representative site, stop.

    - id: swallowed-exception.2
      applies_when: |
        The repo performs network, filesystem, database, or other IO in more
        than one place.
      hunt: |
        Find IO whose failure is indistinguishable from its success. The
        dangerous shape is a function that returns a usable-looking value
        whether or not the IO worked: a config loader returning defaults on
        read failure, a fetch returning [] on error, a save that reports OK
        without checking the write. Trace at least one caller of each: what does
        the caller DO with that default value that it would not do if it knew
        the operation had failed?
      evidence: |
        The IO site (file:line), the caller that consumes the ambiguous value,
        and a concrete consequence: "on failure this will silently start with an
        empty config / drop this record / report success". Then either
        distinguish failure from success, or justify the default in one line.
      not_applicable: |
        The repo performs no IO, or every IO site already distinguishes failure
        from success. Say so, stop.

    - id: swallowed-exception.3
      applies_when: |
        The repo runs background work: threads, async tasks, timers, workers,
        queue consumers, or subprocesses.
      hunt: |
        Find failures that die silently off the main path. An exception in a
        background worker frequently has nowhere to surface and is simply lost.
        Look for thread/subprocess targets with no try/except and no error
        channel; asyncio tasks created without being awaited or given a
        done-callback, so their exception is never retrieved; queue consumers
        that ack before the work succeeds; .then/.catch chains where the
        rejection path is empty.
      evidence: |
        The background entry point (file:line), the failure mode that will be
        silently lost, and a change that surfaces it: an error channel, a
        done-callback, logging with context, or failing the enclosing
        operation. Show the surface working, or say what part is unverifiable.
      not_applicable: |
        All work is on one synchronous path with no background execution. State
        how you confirmed that, stop.

    - id: swallowed-exception.4
      applies_when: |
        The repo parses, validates, or marshals external data (JSON, YAML,
        config, request bodies, file formats).
      hunt: |
        Find parse and validation failures that degrade into plausible wrong
        data rather than refusing. Look for: parse errors caught and replaced
        with an empty structure; required fields accessed with a default (get/
        or default) where the absence means the record is invalid; type
        coercion that turns a bad value into a valid-looking one (str() on
        anything, parseInt of garbage -> NaN flowing onward); lenient modes
        enabled globally (YAML safe_load fallback, json parse with trailing
        data ignored).
      evidence: |
        The site (file:line) and a concrete input that today yields wrong-but-
        accepted data, with the value it produces. Then either reject the input
        explicitly, or write the one line justifying the permissive default.
        Include the failing input in a test if a suite exists.
      not_applicable: |
        The repo parses no external data. Say so, stop.
  off-by-one:
    - id: off-by-one.1
      applies_when: |
        The repo contains index arithmetic, slicing, ranges, or pagination --
        i.e. code that computes a position or a window into a sequence.
      hunt: |
        Find boundaries computed one element too wide or too narrow. Read every
        comparison against a length/size as "should this be < or <=?". Look for:
        range(len(x)) where x[0] or x[-1] is then skipped; slicing with an
        inclusive end (x[a:b+1] where b IS the index); pagination offset math
        (page*size vs (page-1)*size); > where >= is meant; loop counters
        initialised to 1 when they should be 0. Language tells: Python's range
        exclusive end, C's i <= n, JS's arr.length vs arr.length-1.
      evidence: |
        file:line for each boundary, the input at the edge that exposes it (first
        item, last item, exactly-full page, empty collection), and the corrected
        comparison. Show the edge case as a test that fails before the fix and
        passes after -- or state plainly that you could not reproduce it.
      not_applicable: |
        The repo computes no indices, ranges, or pagination windows. Say what you
        searched for, stop.

    - id: off-by-one.2
      applies_when: |
        The repo loops over a collection while building, filtering, or mutating
        that same collection.
      hunt: |
        Find skips and double-visits caused by mutating while iterating. The
        classic failure: removing item i shifts everything after it, so the
        element that moves into slot i is never examined. Look for remove/
        delete/splice inside a forward loop; append inside a loop over the same
        list (infinite growth); filtering a list in place with a manual index.
        Cross-language tells: Python's list.remove in a for-loop, JS's splice
        during forEach, Go's delete from a map while ranging it.
      evidence: |
        The loop (file:line), a concrete collection where an element is missed
        or visited twice (show the input and the wrong output), and a fix
        (iterate a copy, iterate backwards, build a new list). Prove it with the
        smallest input that exposed the bug.
      not_applicable: |
        No loop mutates the collection it iterates. State how you checked, stop.

    - id: off-by-one.3
      applies_when: |
        The repo performs date, time, or duration arithmetic -- timestamps,
        day/month boundaries, elapsed-time maths, or expiry checks.
      hunt: |
        Find off-by-one errors at time boundaries, where the culprit is almost
        always an inclusive/exclusive or a unit mismatch. Look for: a range
        documented as inclusive with an exclusive bound (or the reverse) at a
        month or day boundary; comparing a duration in seconds against a value
        in milliseconds; "now" captured before an operation and compared after
        it, so the operation's own time is not counted; midnight/leap/daylight
        crossings assumed to be exactly 24h apart.
      evidence: |
        The comparison (file:line), the exact date/time input that exposes the
        error (a month end, a leap day, a DST switch), the wrong result it
        produces, and the corrected arithmetic. Show it with a test or a
        reproduction command -- not a description of what would happen.
      not_applicable: |
        No date, time, or duration arithmetic exists. Say so, stop.

    - id: off-by-one.4
      applies_when: |
        The repo parses or produces text with delimiters, lines, fields, or
        fixed-width columns.
      hunt: |
        Find delimiter and line-splitting errors that misalign fields. Look for:
        split() that assumes a trailing delimiter creates a final empty field
        (or fails when one is present); CSV parsing that cannot handle a
        quoted comma; column slicing off by one on fixed-width input; a
        header row counted as data (or vice versa); strip() applied to a chunk
        that legitimately ends in whitespace.
      evidence: |
        A real input (paste it) where the parse yields the wrong field count or
        the wrong values, the file:line, and the corrected parse. Include the
        input as a test case if a suite exists. If no such input exists, say so
        explicitly and show the closest one you tried.
      not_applicable: |
        The repo parses no delimited or fixed-width text. Say so, stop.

  race-condition:
    - id: race-condition.1
      applies_when: |
        The repo has more than one execution context that can touch shared state
        -- threads, processes, async tasks, callbacks, or interrupt handlers
        sharing a mutable object, global, file, or database row.
      hunt: |
        Find shared mutable state with no coordination. Do not look only for
        explicit threads: a single-threaded async runtime interleaves at every
        await/yield, so a check-then-act across an await is a race too. Look
        for: read-modify-write of a counter/flag without a lock; "if not
        exists: create" across an await or a DB round-trip; lazy one-time
        initialisation that can run twice; two callbacks mutating the same
        dict/list. Tell-tale shape: a condition and its action separated by
        anything that can suspend.
      evidence: |
        The shared value, both contexts that touch it (file:line for each), and
        the interleaving that breaks it, written as an explicit step sequence
        (A reads, B writes, A writes back). Then a fix: a lock, an atomic
        operation, or reordering so the check-and-act cannot interleave. If you
        cannot construct a concrete interleaving, say so rather than asserting
        the risk abstractly.
      not_applicable: |
        There is exactly one execution context and no suspension point between
        any check and its matching action. Show the single entry path, stop.

    - id: race-condition.2
      applies_when: |
        The repo holds a lock, mutex, semaphore, or advisory lock -- or should
        hold one around shared state.
      hunt: |
        Find lock misuse: work done while holding a lock that should not be, or
        state mutated without it. Look for: IO, network, subprocess, or a
        callback invoked under a lock (which can deadlock if it re-enters);
        two locks acquired in inconsistent order in different code paths (the
        classic deadlock); a lock held across an await, blocking everything;
        early return or an exception inside the locked region that skips the
        release -- cross-language tell: JS try/finally or Go defer needed but
        absent; release() on a path that can run twice.
      evidence: |
        The lock and its scope (file:line), the specific hazard (the two orders,
        or the skipped release), and a narrowed scope or corrected ordering.
        For a deadlock, write the two acquisition orders explicitly. For a
        skipped release, name the exact early-return or throw path.
      not_applicable: |
        The repo has no locks and no shared mutable state. Say so, stop.

    - id: race-condition.3
      applies_when: |
        The repo writes to files or persists state, and more than one writer (or
        a writer plus a reader) can reach that state.
      hunt: |
        Find non-atomic persistence. A partially written file that another
        process reads mid-write is corrupt even though neither writer is buggy.
        Look for: writing a file in place instead of write-temp-then-rename;
        truncate-then-write on a file others read; a database read-modify-write
        outside a transaction; two processes appending to the same log with no
        locking; a cache written without a version/stamp so a half-updated
        entry looks valid. Language tell: open(path,"w") is the classic
        destructive write.
      evidence: |
        The write site (file:line), who can read it concurrently, and the
        concrete corruption (what a reader sees if it lands mid-write). Then a
        fix: atomic replace, a transaction, or a lock. Where the risk is
        theoretical, say what would have to be true for it to bite.
      not_applicable: |
        The repo persists nothing, or a single writer with no concurrent
        readers. State which, stop.

    - id: race-condition.4
      applies_when: |
        The repo runs tests, builds, or scripts that use a shared resource --
        a fixed port, a temp path, a database, a container name, or a cache dir.
      hunt: |
        Find hard-coded shared resources that collide when two runs overlap.
        This repo's own loop may be the second runner. Look for: a fixed port
        in test setup; a fixed temp filename in a shared dir; a test database or
        schema reused across runs; a container/branch name derived from a
        constant; a dev server that never releases its port on crash. Tell-tale
        symptom described in the code or docs: "run alone", flaky in CI,
        requires a clean checkout.
      evidence: |
        The shared resource (file:line), the two runs that collide, and the
        failure each sees. Then a fix: a per-run unique name/port, or a lock.
        State explicitly if you judged the collision impossible in this repo and
        why.
      not_applicable: |
        Test/build infrastructure uses no fixed shared resource. Say so, stop.

  resource-leak:
    - id: resource-leak.1
      applies_when: |
        The repo opens OS-level handles: files, sockets, database connections,
        subprocesses, or locks.
      hunt: |
        Find handles opened on a path that can return or raise before the handle
        is released. The dangerous shape is an early exit -- a validation
        failure, an exception, a continue/break -- between acquisition and
        release. Look for: open()/connect() not inside a context manager or
        try-finally; a return placed before the close; an exception raised
        between acquire and release; a connection checked out of a pool and
        never returned on the error path. Cross-language tells: Python's
        missing `with`, JS's missing try/finally around a client, C's goto-less
        early returns before free/close.
      evidence: |
        The acquisition site (file:line) and the exact early-exit path that
        skips release. Then a fix that makes release unconditional (context
        manager, defer, finally) and a demonstration: force that early exit and
        show the handle is released. On long-running code, show the leak
        accumulating (handle count or pool exhaustion) rather than asserting it.
      not_applicable: |
        The repo opens no OS handles. State what you searched for, stop.

    - id: resource-leak.2
      applies_when: |
        The repo is a long-running process: a server, daemon, worker, game loop,
        or anything that runs for hours.
      hunt: |
        Find state that grows without bound across the process lifetime --
        leaks that would be harmless in a short-lived script. Look for: caches
        and memo dicts with no eviction; listeners/callbacks registered per
        request but never removed; growing lists of log lines, history, or
        events retained forever; per-iteration object creation appended to a
        module-level collection; an id-keyed map whose entries are never
        deleted. The test is not "does it grow" but "does anything ever shrink
        it".
      evidence: |
        The growing structure (file:line), what adds to it, and proof that
        nothing removes from it -- show the only-increase path. Then a bound
        (maxlen, LRU, explicit eviction, weakref) or a justification for unbounded
        growth. If you can, demonstrate growth over N iterations with real
        numbers from a run; if you cannot run it, say so plainly.
      not_applicable: |
        The repo is a short-lived script that exits, or every collection has a
        removal path. Name the removal paths you found, stop.

    - id: resource-leak.3
      applies_when: |
        The repo creates subprocesses, child processes, threads, or async tasks.
      hunt: |
        Find children that are never reaped or never awaited, leaving zombies or
        orphaned work. Look for: subprocess started without wait() or
        communicate(); a thread started and never joined when its completion
        matters; asyncio task created and dropped (no reference kept, so the GC
        can cancel it); a child whose stdout/stderr pipes are never drained,
        which deadlocks once the pipe buffer fills -- a very common one.
        Cross-language tells: JS child_process without a kill on timeout,
        Python subprocess.Popen with PIPE but no communicate().
      evidence: |
        The spawn site (file:line), which of these three it is (unreaped,
        unawaited, or undrained pipe), and the concrete consequence. Then a fix
        (wait/communicate/await/keep-a-reference/timeout). Where a pipe deadlock
        is the risk, name the buffer size or the log volume that would trigger
        it.
      not_applicable: |
        The repo spawns no subprocesses, threads, or tasks. Say so, stop.

    - id: resource-leak.4
      applies_when: |
        The repo handles user sessions, requests, connections, or temporary files.
      hunt: |
        Find per-session resources that outlive their session. Look for: session
        or request state stored in a module-global dict and never cleared on
        disconnect; temp files created without deletion (including on the error
        path); a websocket/connection registry that only ever adds; uploaded
        files kept after processing; locks or locks-files left behind by a run
        that crashed. The tell is a cleanup routine that only runs on the happy
        path.
      evidence: |
        The session-scoped resource (file:line), the disconnect/error path that
        fails to clean it, and evidence that cleanup is happy-path-only. Then a
        fix (cleanup in a finally/disconnect handler, a TTL sweep) plus how you
        confirmed the resource is now released on the abnormal path.
      not_applicable: |
        The repo has no sessions, requests, or temp files. Say so, stop.

  unsafe-none:
    - id: unsafe-none.1
      applies_when: |
        The language has a null/None/nil/undefined concept (Python, JS, Java,
        C#, Ruby, PHP, Go pointers, C pointers).
      hunt: |
        Find values that can legitimately be empty but are consumed as if they
        cannot. Trace the SOURCE, not the call site: a dict.get(), a DB row that
        may be absent, a JSON field that may be missing, a function documented
        as "returns None if not found", a regex with no match. Then check every
        consumer of that value for a guard. Report as a finding when the value
        can really be absent AND a consumer dereferences it -- not merely
        because the code uses .get().
      evidence: |
        The source of the nullable value (file:line), the proof it can be absent
        (the default, the except-return, the documented contract), and the
        consumer that would crash (file:line) with the input that makes it
        absent. Then a fix: an explicit guard, a default, or an early return.
        Show the crash input as a test if the suite allows.
      not_applicable: |
        No nullable values exist, or every nullable value is guarded. Name one
        guard you checked to show you did the work, stop.

    - id: unsafe-none.2
      applies_when: |
        The repo has functions that return a value OR an error/failure, and
        callers that use the return value.
      hunt: |
        Find error returns whose VALUE is consumed anyway. This is the
        companion failure to swallowed errors: the error is raised or returned,
        but the caller uses the value regardless. Look for: a function returning
        (value, error) or (ok, value) where callers unpack and use value without
        checking ok; a Python function returning None on failure where the
        caller assumes a dict; an optional chain that silently yields undefined
        and flows into arithmetic or string building.
      evidence: |
        The producer (file:line) and each caller that ignores the failure
        signal, with the concrete wrong behaviour on failure (e.g. "on a failed
        lookup this writes 'undefined' into the report"). Then a fix at the
        callers: check first, or restructure so failure cannot be ignored.
      not_applicable: |
        Every consumer already checks the failure signal. Point at two that do,
        stop.

    - id: unsafe-none.3
      applies_when: |
        The repo constructs objects, dataclasses, records, or config structures
        from external input.
      hunt: |
        Find required fields that are optional in practice. A field with a
        default of None/""/0 that the rest of the code treats as mandatory is a
        latent crash waiting for the first input that omits it. Cross-check the
        validator against the consumers: does validation actually reject the
        absent field, or does it accept and pass None along? Look for default
        values that mean "unknown" but are never converted into a rejection.
      evidence: |
        The field declaration (file:line), the consumers that require it, and
        the input that omits it -- show what happens then (the wrong value or
        the crash). Then either make validation reject the input, or make the
        consumers tolerate the default. State which and why.
      not_applicable: |
        Every field is either genuinely optional and handled, or genuinely
        required and validated. Show one validator that rejects, stop.

    - id: unsafe-none.4
      applies_when: |
        The repo uses chained attribute access, nested lookups, or deeply
        nested dictionaries built from parsed data.
      hunt: |
        Find chains that assume every link exists. Look for: a['b']['c'] on
        parsed JSON; object.user.profile.email where any link may be absent;
        chained method calls on a possibly-None return; a dict built by merging
        partial updates where a key may be missing. The question is not whether
        it looks nested, but whether each link is independently guaranteed.
      evidence: |
        The chain (file:line) and the specific absent link that breaks it, with
        the input that omits that key and the resulting crash or wrong value.
        Then a fix: explicit guards, .get() with a real default, or a schema
        check at the parse boundary so the chain is safe by construction.
      not_applicable: |
        The repo performs no nested lookups on external data. Say so, stop.

  unreachable-branch:
    - id: unreachable-branch.1
      applies_when: |
        The repo contains conditionals, and at least some conditions reference
        multiple flags, states, or enum values together.
      hunt: |
        Find conditions that can never be true, or can never be false. Look for:
        a condition combining a flag with its own negation (x and not x) through
        intermediate variables; an enum compared against a value it cannot hold
        at that point; a guard repeated after an earlier guard already returned
        for the same case; a branch whose body is dead because an earlier
        if/elif always catches it. Track the value's possible states from where
        it is set, not from what the name suggests.
      evidence: |
        The condition (file:line) and the derivation of why it is unreachable or
        always-true -- enumerate the possible values at that point and show none
        (or all) satisfy it. Then delete the dead branch, or fix the condition if
        the intent was different. Say which, and cite the value's assignment
        sites as proof.
      not_applicable: |
        The repo has no conditionals. Say so, stop.

    - id: unreachable-branch.2
      applies_when: |
        The repo has functions with early returns, raises, or exits.
      hunt: |
        Find statements that sit after an unconditional exit and can never run.
        Look for: code after a return/raise/exit/continue/break at the same
        level; a second return that duplicates the first; a cleanup call placed
        after an unconditional raise; a fallback path shadowed by an earlier
        always-true guard. Use a linter's dead-code output as a lead if one is
        configured, but verify each hit by reading the control flow.
      evidence: |
        The unreachable statement (file:line) and the unconditional exit that
        precedes it (file:line). Then remove it, or explain why it is
        deliberately there (e.g. documentation, a compiler hint) in one line.
      not_applicable: |
        Each function exits once or conditionally throughout. Say so, stop.

    - id: unreachable-branch.3
      applies_when: |
        The repo has error handling, fallbacks, defaults, or defensive paths.
      hunt: |
        Find defensive code that cannot be triggered by any real input -- the
        untested, unexercised half of a guard. Beware: it may be there for a
        reason. Your job is to determine WHICH, not to delete on sight. Look for:
        a fallback for a state the caller can never send; an except clause for an
        exception the called code never raises; a null-check on a value that is
        constructed non-null; a "should never happen" comment with no proof.
      evidence: |
        The defensive path (file:line), the analysis of why no input reaches it
        (trace the callers), and a verdict: either remove it, or KEEP it with a
        stated reason (external API contract, future caller, defence against a
        documented upstream bug). Both verdicts are valid; an unsupported
        deletion is not.
      not_applicable: |
        The repo has no defensive/fallback paths beyond simple validation. Say
        so, stop.

    - id: unreachable-branch.4
      applies_when: |
        The repo has feature flags, environment switches, platform checks, or
        config-gated branches.
      hunt: |
        Find branches that are permanently on or permanently off in this
        repository as configured. A flag hard-coded true, an env var never set
        anywhere, a platform check for an OS this project never targets, a
        version gate for an older version than the declared minimum. For each,
        decide whether the dead side should be deleted or the gate should be
        honoured.
      evidence: |
        The flag/gate (file:line), where it is set (or the proof it is never
        set), and which branch is therefore dead. Then either delete the dead
        side, or wire the flag properly. If the flag is set outside this repo
        (deployment config), say so and stop -- that is not a finding.
      not_applicable: |
        No feature flags, env switches, or platform gates exist. Say so, stop.

  state-round-trip:
    - id: state-round-trip.1
      applies_when: |
        The repo persists data: files, a database, a save file, or a serialised
        blob.
      hunt: |
        Find data written that does not survive a write-read cycle intact. Pick
        the REAL structure the app saves, write it, read it back, and compare
        field by field. Look for: types that change (a set becomes a list, a
        tuple becomes a list, an int key becomes a string, a datetime becomes a
        string); None becoming the string "None"; NaN/Infinity breaking JSON;
        floats losing precision; bytes not surviving; an object reconstructed
        with a different class than it had.
      evidence: |
        The exact before/after values for every field that changed, from a real
        write-read cycle you executed (paste the comparison output). Then a fix:
        a typed decode, a schema, or a documented normalisation. Do not report a
        type change you did not actually observe -- run it.
      not_applicable: |
        The repo persists nothing. State what you checked, stop.

    - id: state-round-trip.2
      applies_when: |
        The repo has a save/load, export/import, or serialise/deserialise pair.
      hunt: |
        Find fields that are saved but never restored, or restored but never
        saved. The failure is silent: the app works until the user reloads, then
        behaves differently. Build the field list from the class definition and
        check each one against both directions. Look for: a field added to the
        class but not to save; a save key with a typo so load never finds it; a
        field saved under one name and read under another; defaults applied on
        load that silently overwrite saved values.
      evidence: |
        A field-by-field table: field -> saved? -> restored? -> what a saved
        value becomes after reload, with at least one field shown changing from
        its saved value to a default. Then fix the asymmetry. If every field
        round-trips, say so and show the table as the proof.
      not_applicable: |
        No save/load, export/import, or serialise/deserialise pair exists. Say
        so, stop.

    - id: state-round-trip.3
      applies_when: |
        The repo reads persisted state that was written by an older version of
        the code, or that users may edit by hand.
      hunt: |
        Find older-state inputs that crash or silently corrupt the new code.
        Construct a plausible old-format file (missing a field that newer code
        requires, or carrying an old field name/type) and run the real loader on
        it. Look for: strict validation that rejects old but valid files;
        implicit assumptions that a field exists; a version number that is read
        but never acted on; hand-edited files with a stray key crashing the
        parse.
      evidence: |
        The old-format input (show it), the loader's actual behaviour on it
        (crash or corruption -- paste the output), and the file:line that
        assumes the new shape. Then a migration or a tolerant read with a
        stated default. If you could not construct a break, say which shapes you
        tried.
      not_applicable: |
        All persisted state is created and consumed by the same version with no
        external editing. State how you verified that, stop.

    - id: state-round-trip.4
      applies_when: |
        The repo stores state that is mutated over time and later inspected --
        counters, histories, queues, or accumulators.
      hunt: |
        Find state that drifts from what it claims to represent. Look for: a
        counter incremented in one place and decremented in another, where a
        path does only one; a history list capped by truncation that loses whole
        records instead of oldest-first; a queue whose length is used as a
        pending-count after items are cancelled; a total stored rather than
        computed, so it can disagree with its parts. The test: recompute the
        value from its parts and compare to the stored value.
      evidence: |
        The stored value (file:line) and its separately-maintained parts, with a
        concrete sequence of operations where they disagree -- show the
        arithmetic. Then either compute instead of store, or fix the missing
        update. Report the numbers you observed, not hypothetical ones.
      not_applicable: |
        No accumulated state exists that is later read back. Say so, stop.

  garbage-input:
    - id: garbage-input.1
      applies_when: |
        The repo accepts external input: an API, a CLI, a file parser, a form, or
        a network message.
      hunt: |
        Find inputs that crash rather than reject. Do not speculate -- construct
        the hostile input and run it. Work through: empty string, whitespace
        only, very long string, a string of only delimiters, wrong type (number
        where string expected), unicode/emoji/RTL text, embedded null byte, a
        path traversal (../../), a huge number, negative where positive is
        implied, a very large list. Cross-check what the validator claims versus
        what it actually rejects.
      evidence: |
        A table of inputs you ACTUALLY SENT and the ACTUAL result (status code,
        exception type, or wrong output) -- paste the real run output. Then a fix
        that rejects the crashing inputs with a clear error. Mark any input you
        could not test and why. Do not report a crash you did not reproduce.
      not_applicable: |
        The repo accepts no external input. Say so, stop.

    - id: garbage-input.2
      applies_when: |
        The repo parses structured data: JSON, YAML, XML, CSV, a query string,
        or a config file.
      hunt: |
        Find structured inputs that yield a valid parse of the WRONG shape. The
        danger is not a parse error, it is a successful parse that produces a
        type or structure the consumer does not expect: an array where an object
        is expected, a nested object where a scalar is expected, a numeric string
        used as a number, a duplicate key silently taking the last value, a
        trailing-garbage document accepted leniently, deeply nested input causing
        recursion limits.
      evidence: |
        Each malformed-but-accepted input (show it verbatim), the parsed result
        it produces, and the downstream consumer that misbehaves because of it
        (file:line). Then a schema or explicit shape check at the parse boundary.
        Paste real parse output -- do not describe what would happen.
      not_applicable: |
        The repo parses no structured data. Say so, stop.

    - id: garbage-input.3
      applies_when: |
        The repo takes numeric, date, or bounded-range input from a user or an
        external system.
      hunt: |
        Find values outside the expected range that are accepted. Construct and
        test: zero, negative, NaN/Infinity, a number beyond the type's range, a
        float where an int is required, a date in the far past/future, an empty
        list, a list longer than intended. Then check the arithmetic that follows:
        does a negative quantity produce a negative total? does a zero divisor get
        guarded? does an out-of-range value index a collection?
      evidence: |
        The values you tested with the actual resulting behaviour (paste it):
        wrong output, crash, or silent corruption. Then a range check with a
        stated bound. If a value is legitimately allowed, say why rather than
        adding a pointless guard.
      not_applicable: |
        The repo takes no numeric, date, or range-bounded input. Say so, stop.

    - id: garbage-input.4
      applies_when: |
        The repo handles names, paths, filenames, or identifiers supplied by a
        user or an external source.
      hunt: |
        Find unsafe use of externally-supplied names. Construct and test:
        path traversal (../, absolute paths, encoded variants), a name with shell
        metacharacters, a name that collides with an existing file or an internal
        reserved name, a name with leading/trailing whitespace, a name that is
        only dots, an extremely long name, a reserved Windows name (CON, PRN,
        AUX, NUL) where relevant, a name with slashes or null bytes.
      evidence: |
        Each name you tested and what actually happened (paste the output):
        a file written outside the intended directory, a shell command executed,
        an unexpected overwrite. Then a sanitiser or an allowlist. Where the
        input never reaches the filesystem or a shell, say so and skip.
      not_applicable: |
        No externally-supplied names reach a path, filename, or shell. Say so,
        stop.

  network-failure:
    - id: network-failure.1
      applies_when: |
        The repo makes outbound network calls: HTTP, a database over the wire, a
        socket, or a third-party API.
      hunt: |
        Find outbound calls with no timeout. Without a timeout, a hung peer
        hangs the caller forever -- in a synchronous path this can wedge an
        entire server. Look for: an HTTP client constructed once with no timeout;
        a connect/read timeout set on one call site but not others; a database
        connection with no statement/query timeout; a raw socket with no
        settimeout; a library default that is "wait forever".
      evidence: |
        Every outbound call site lacking a timeout (file:line) and what hangs if
        the peer accepts the connection then sends nothing. Then add explicit
        connect AND read timeouts. Name the timeout values you chose and why.
        This is the highest-value fix in this family -- be thorough.
      not_applicable: |
        The repo makes no outbound calls. Say so, stop.

    - id: network-failure.2
      applies_when: |
        The repo calls a remote service whose failure must not break the local
        operation (or must degrade gracefully).
      hunt: |
        Find calls with no retry, or a retry that is worse than none. Look for:
        a single attempt on a flaky service; retries with no backoff (a tight
        loop that hammers a struggling peer); retries that re-send a NON-
        idempotent request (a duplicate charge, a double insert); retries on
        4xx responses that will never succeed; a missing circuit breaker so a
        downed dependency is retried forever.
      evidence: |
        The call site (file:line), what happens on failure today (paste the
        actual error path if you can trigger it), and the fix: bounded retries,
        exponential backoff, and only on idempotent/retryable errors. State
        explicitly whether the request is idempotent -- a retry added to a
        non-idempotent call is a bug, not a fix.
      not_applicable: |
        No remote calls exist whose failure needs handling. Say so, stop.

    - id: network-failure.3
      applies_when: |
        The repo depends on a remote service at startup or during normal
        operation.
      hunt: |
        Find behaviour when the dependency is DOWN at start or goes down mid-run.
        Test the real scenario where you can: start the app with the dependency
        unreachable, or stop it while the app runs. Look for: a crash at startup
        instead of a clear message and a retry; a permanent error state with no
        recovery once the dependency returns; a health check that reports healthy
        while the dependency is down; requests that hang instead of failing fast.
      evidence: |
        What actually happens when the dependency is unavailable (paste real
        output: the stack trace or the log line), and the desired behaviour. Then
        a fix: fail fast with a clear message, or degrade, or recover
        automatically. Include how you simulated the outage.
      not_applicable: |
        The repo has no remote dependencies. Say so, stop.

    - id: network-failure.4
      applies_when: |
        The repo parses responses from a remote service.
      hunt: |
        Find response handling that trusts the peer. Look for: response.json()
        with no status check; a 500 HTML error page fed into a JSON parser; a
        missing key accessed directly; a partial response treated as complete
        (truncated body, an empty 200, a paginated first page treated as all
        results); a redirect followed silently; a response whose shape changed
        because the API versioned.
      evidence: |
        The parse site (file:line) and the malformed/partial/error response that
        breaks or corrupts it -- show the real input and the real failure. Then a
        status check plus a shape check at the parse boundary. If the service is
        unreachable so you cannot capture a real bad response, say so and reason
        from the API contract instead of inventing a transcript.
      not_applicable: |
        The repo parses no remote responses. Say so, stop.

  unbounded-growth:
    - id: unbounded-growth.1
      applies_when: |
        The repo parses or generates files, streams, or responses whose size is
        not fixed by the code.
      hunt: |
        Find reads that pull every byte into memory. The failure is a file or
        response far larger than the author imagined, which exhausts memory
        instead of erroring cleanly. Look for: read()/readlines() with no size
        cap; a full-body HTTP fetch of a potentially huge resource; a JSON parse
        of an unbounded stream; a decompression step with no expansion limit
        (zip bomb); an upload accepted with no size check before buffering.
      evidence: |
        The unbounded read (file:line) and the size at which it becomes a
        problem, with a real measurement where you can make one (peak memory for
        an N-byte input). Then a size limit, a streaming read, or an explicit
        refusal above a threshold. State the limit you chose.
      not_applicable: |
        All inputs are fixed-size or already capped. Point at the cap you found,
        stop.

    - id: unbounded-growth.2
      applies_when: |
        The repo accumulates results: collecting rows, appending to lists,
        building reports, or gathering logs.
      hunt: |
        Find accumulations whose size is driven by data rather than by a constant
        in the code. Look for: SELECT without LIMIT feeding a list that is fully
        materialised; a report that concatenates every record into one string;
        logs buffered in memory before flushing; a loop that appends one entry per
        input item with no cap. The question: what happens when the table has a
        million rows?
      evidence: |
        The accumulation (file:line), what determines its size (name the data
        source), and the practical volume at which it fails. Then a fix:
        pagination, streaming, chunking, or a limit with a clear error. If a
        dataset of this size is impossible in this domain, say so as your reason
        and stop.
      not_applicable: |
        Every accumulation is bounded by a constant or a small fixed set. Say so,
        stop.

    - id: unbounded-growth.3
      applies_when: |
        The repo is a long-running process that retains history, events, sessions,
        or messages.
      hunt: |
        Find retained history with no ceiling. Look for: an event log, chat
        history, or audit trail that is a plain list; a per-session message
        buffer; a metrics window that only appends; a queue that is produced into
        faster than it is consumed with no bound. Confirm by finding the ONE
        place that would remove items -- if there is none, that is the finding.
      evidence: |
        The structure (file:line), its producer, and the absence of any removal
        path (show that you searched). Then a bound with a stated policy for what
        is dropped (oldest-first, sampled, aggregated). State the ceiling value.
      not_applicable: |
        No unbounded retained history exists. Name the removal path you found,
        stop.

    - id: unbounded-growth.4
      applies_when: |
        The repo accepts concurrent connections, requests, sessions, or tasks.
      hunt: |
        Find resource consumption that scales with concurrency and has no
        ceiling. Look for: no limit on simultaneous connections; a thread or task
        spawned per request with no pool and no cap (an easy resource-exhaustion
        path); a per-connection buffer allocated optimistically; no queue depth
        limit so a burst is accepted until memory runs out; no rate limit anywhere
        on an exposed endpoint.
      evidence: |
        The unbounded concurrency point (file:line), the burst size that exhausts
        the resource, and a fix: a pool, a semaphore, a max-connections setting,
        or a queue bound with a rejection policy. If the deployment topology caps
        concurrency upstream (a proxy with limits), say so instead.
      not_applicable: |
        Nothing in the repo scales with concurrency, or concurrency is already
        capped. Point at the cap, stop.

  restart-mid-write:
    - id: restart-mid-write.1
      applies_when: |
        The repo writes files that are later read back as valid state.
      hunt: |
        Find writes that are not atomic, so a crash mid-write leaves a corrupt
        file where a valid one used to be. Look for: open(path, "w") followed by
        writes -- a crash between the truncate and the close destroys the
        original with nothing to fall back on; a multi-file save with no
        transaction; a zip/tar built in place. The correct pattern is write to a
        temp file in the SAME directory, fsync, then os.replace/rename (atomic
        on the same filesystem).
      evidence: |
        Each non-atomic write (file:line), what a crash at each point would leave
        behind, and the atomic replacement applied. Where you can, demonstrate:
        simulate a failure mid-write on a copy and show the old file intact after
        the fix.
      not_applicable: |
        The repo writes no files that are later read as state. Say so, stop.

    - id: restart-mid-write.2
      applies_when: |
        The repo mutates persistent state in more than one step: several file
        writes, several DB statements, or a file plus a database.
      hunt: |
        Find multi-step mutations with no transaction or rollback. A crash
        between step 1 and step 2 leaves the state half-updated, which is usually
        worse than either the old or the new state. Look for: two related rows
        written outside a transaction; a file written then a DB row inserted; a
        counter and its detail record updated separately; a rename and a
        registry update that must agree (very relevant to this project).
      evidence: |
        The multi-step sequence (file:line for each step), the inconsistent
        state a crash produces, and a fix: a transaction, a write-then-commit
        ordering with an idempotent recovery, or a single atomic operation. Name
        the exact crash point that is dangerous.
      not_applicable: |
        All persistent mutations are single-step. Say so, stop.

    - id: restart-mid-write.3
      applies_when: |
        The repo runs a background job, queue consumer, or batch process that can
        be interrupted.
      hunt: |
        Find interrupted work that is left half-done with no way to resume or
        clean up. Look for: a batch that processes N records and records progress
        nowhere, so a restart redoes or skips records; an item dequeued and
        deleted before the work succeeds (lost on crash); a "processing" marker
        that is never cleared, so a restart leaves it stuck; partial output that
        is treated as complete on the next run.
      evidence: |
        The job (file:line), the interruption point and the resulting state (a
        record skipped, duplicated, or stuck -- name which), and a fix: check-
        point progress, delete-after-success, or a reap of stale markers. State
        whether re-processing is safe (idempotent) -- if it is not, that is the
        finding.
      not_applicable: |
        No background/batch work exists that could be interrupted mid-item. Say
        so, stop.

    - id: restart-mid-write.4
      applies_when: |
        The repo creates lock files, pid files, or marker files to guard a
        single-run or critical section.
      hunt: |
        Find stale guards that block all future runs after a crash. A pid file or
        lock from a crashed process usually has no owner check, so the next start
        refuses forever. Look for: a pid file written but never validated against
        a live process; a lock file with no stale timeout; a lock whose release
        is not in a finally block; a directory-based lock with no cleanup path.
        Note: this very project has a single-flight guard -- check it honestly.
      evidence: |
        The guard (file:line), the crash scenario that strands it, and the
        resulting refusal. Then a fix: validate the owner is alive, add a stale
        timeout, or release in a finally. Demonstrate by creating the stale guard
        on a COPY and showing the fixed code recovers.
      not_applicable: |
        No lock, pid, or marker files exist. Say so, stop.

  self-ingestion:
    - id: self-ingestion.1
      applies_when: |
        The repo reads its own output, logs, generated files, or emitted artifacts
        back in.
      hunt: |
        Find loops where the system consumes something it produces. Look for: a
        watcher over a directory the app also writes (so its own output triggers
        another run); a scanner that indexes generated files (this project's
        inventory may do exactly this); a log parser reading a log it also
        appends to; a build step whose output feeds the next build. The failure
        is amplification: each cycle produces more input than the last.
      evidence: |
        The write site and the read site (file:line for both) and the concrete
        amplification: one action producing N follow-on actions, with N>1
        measured if you can trigger it. Then a fix: exclude generated paths, mark
        outputs, or record provenance. If the loop terminates naturally, say so
        and show why.
      not_applicable: |
        The repo never reads its own outputs. Say so, stop.

    - id: self-ingestion.2
      applies_when: |
        The repo generates files that live inside a directory it also scans,
        indexes, or walks.
      hunt: |
        Find generated artifacts that will be discovered as if they were source.
        Look for: a cache/ output/ dist/ directory inside a scanned tree; a
        generated report inside a docs folder that gets re-processed; a
        state file inside a watched directory; a generated index included in the
        next index (the classic recursion). Check the actual exclude patterns
        against the actual generator output paths.
      evidence: |
        The generator's output path and the scanner's root + exclude list
        (file:line for both), and the proof they overlap -- ideally by running
        the scan and showing a generated file in the results. Then an exclusion
        or a moved output path.
      not_applicable: |
        Generated files never land in a scanned tree. Name the two paths and why
        they cannot overlap, stop.

    - id: self-ingestion.3
      applies_when: |
        The repo writes a manifest, registry, or index that it also reads to
        decide what to process.
      hunt: |
        Find registries that can drift from reality, or that a failed run can
        corrupt. Look for: an index listing items that no longer exist; state
        written optimistically before the work succeeds; two files that must
        agree (an index and its entries) with no check; a registry entry created
        for a run that then crashed, so it looks processed forever.
      evidence: |
        The registry (file:line) and its entries, with a concrete way they
        disagree today or after a crash -- show the mismatch you found or
        constructed. Then a reconciliation, a verification pass, or write-after-
        success ordering.
      not_applicable: |
        No manifest/registry/index is written. Say so, stop.

    - id: self-ingestion.4
      applies_when: |
        The repo invokes itself, another agent, or a subprocess that can write
        back into the repo.
      hunt: |
        Find recursion and reentrancy: a run that triggers a run. Look for: a
        loop that spawns a process which starts the same loop (this project
        spawns `hermes -z`, which could in principle act on the same repo); a
        hook that fires on a change the hook itself makes; a task that creates
        another task with no depth limit; a subprocess whose output directory is
        the repo itself. The failure is unbounded fan-out or a self-feeding cycle.
      evidence: |
        The invocation chain (file:line for each hop), the depth or fan-out it
        can reach, and the guard that should exist (a depth limit, a lock, an
        env-var marker that suppresses re-entry). If you find no actual cycle,
        say so and name the guard that prevents it.
      not_applicable: |
        The repo never invokes itself or a process that writes back. Say so,
        stop.

  delete-dead-code:
    - id: delete-dead-code.1
      applies_when: |
        The repo has at least a few thousand lines of code across more than one
        module.
      hunt: |
        Find functions, classes, and modules nothing calls. For each candidate,
        verify by searching the WHOLE repo including tests, config, templates,
        entry points, and dynamic references (getattr, string dispatch, a
        registry) -- a dead-looking function wired up by a string is alive. The
        usual true positives: a helper superseded by a library call, two
        implementations where one won, code behind a removed feature.
      evidence: |
        A table: symbol, file:line, the searches you ran, and the verdict. Then
        delete the confirmed-dead ones and show the gate still passes. If unsure,
        do NOT delete -- list it as "candidate, needs owner call" instead. A
        wrong deletion is far more expensive than a missed one.
      not_applicable: |
        The repo is small enough to read end to end and you found no unused
        symbols. Say so, stop.

    - id: delete-dead-code.2
      applies_when: |
        The repo has commented-out code, TODOs, or disabled blocks.
      hunt: |
        Find code preserved as comments. Commented-out code is dead weight that
        lies about the current design and rots. Distinguish it from commentary:
        an explanatory comment stays, a commented-out block goes. Look for:
        large /* */ blocks containing real statements; a # def or // function
        block; several versions of the same function where all but one are
        commented; TODO comments describing work already done.
      evidence: |
        file:line for each block removed, with a one-line note on what it was, and
        confirmation the gate still passes. Where the comment carries intent
        worth keeping (a design rationale), REWRITE it as prose rather than
        deleting the insight -- say which you did.
      not_applicable: |
        The repo has no commented-out code. Say so, stop.

    - id: delete-dead-code.3
      applies_when: |
        The repo has configuration, dependencies, or assets.
      hunt: |
        Find configuration and dependencies that nothing uses. Look for: a config
        key read by no code (grep the key name); a dependency in the manifest
        imported nowhere; an asset file referenced by no template or code; an
        environment variable documented but never read; a feature flag set but
        never checked. Cross-check by searching for the KEY, not the concept --
        the name is the evidence.
      evidence: |
        A table of candidates with the search that proved each unused, then the
        removals applied and the gate re-run. For a dependency, confirm by
        removing it and running the full test suite -- an unused import is
        invisible until you take it out.
      not_applicable: |
        Every config key and dependency is referenced. Say so, stop.

    - id: delete-dead-code.4
      applies_when: |
        The repo has tests for code that no longer exists, or test helpers nobody
        calls.
      hunt: |
        Find tests that assert on removed behaviour, or import symbols that are
        gone. Look for: a test importing a name that no longer exists (it would
        fail to collect, or is skipped); a test helper used nowhere; fixtures
        defined and never requested; a whole test file for a deleted module. Note
        the risk: a test that still passes may be pinning behaviour through a
        different path -- verify before removing.
      evidence: |
        file:line for each removable test, the proof it tests nothing (the symbol
        is gone, or the helper has no callers), and the gate still passing after
        removal. If a test fails on removal, it was alive -- report that instead.
      not_applicable: |
        The test suite matches the current code. Say so, stop.

  collapse-duplication:
    - id: collapse-duplication.1
      applies_when: |
        The repo has repeated blocks of near-identical code.
      hunt: |
        Find the duplication with the HIGHEST risk, not the largest volume. The
        valuable collapse is one where the copies have DIVERGED (a fix applied to
        one and not the others), because that is a live bug. Ignore duplication
        that is merely verbose if collapsing it would couple unrelated concerns.
        Look for: the same validation in three endpoints with different rules;
        the same error handling copy-pasted with one variant; a helper that grew
        a second near-copy.
      evidence: |
        The copies (file:line for each), a diff of how they differ, and the
        verdict: a real divergence (name the bug) or benign repetition. Then the
        collapse, or a stated reason to leave it. Prove the gate passes after.
      not_applicable: |
        The repo has no significant repeated logic. Say what you compared, stop.

    - id: collapse-duplication.2
      applies_when: |
        The repo has multiple entry points, handlers, or routes that share a
        preamble.
      hunt: |
        Find repeated setup that should be applied uniformly -- because any one
        site that forgets a step is a bug. Look for: auth checks repeated per
        route with one route missing it; logging/context setup copy-pasted; input
        parsing repeated with one variant stricter than the rest; teardown that
        some paths perform and others skip. Uniformity is the goal; a missing
        check is a security or correctness hole.
      evidence: |
        A table of the sites and which steps each performs, highlighting any site
        missing a step the others apply (that is the finding). Then a shared
        wrapper/middleware/decorator. Show the gate passing, and point at the
        specific site that was previously unprotected.
      not_applicable: |
        Entry points share no meaningful preamble, or a shared layer already
        exists. Name it, stop.

    - id: collapse-duplication.3
      applies_when: |
        The repo has parallel data structures, mappings, or type definitions that
        describe the same thing.
      hunt: |
        Find two definitions that must stay in sync and can drift. Look for: a
        Python class and a matching SQL schema; a frontend type and a backend
        model; a list of allowed values duplicated in a validator and a template;
        two enums for the same domain. The bug is always the same: someone adds a
        value to one and not the other.
      evidence: |
        Both definitions (file:line each) with the drift you FOUND (name a value
        present in one and missing in the other), and a fix: generate one from
        the other, or share a single source. If they currently agree, say so and
        name the change that would break them -- that is the risk to record.
      not_applicable: |
        No parallel definitions of the same data exist. Say so, stop.

    - id: collapse-duplication.4
      applies_when: |
        The repo contains long functions or files that repeat their own internal
        pattern.
      hunt: |
        Find an internal pattern worth naming: a function doing the same 10 lines
        three times with different inputs. This is about extracting a concept,
        not shrinking line count. Look for: three similar blocks in one function;
        a long if/elif chain over the same shape; a file that repeats a
        boilerplate structure per entry (a sign of missing indirection).
      evidence: |
        The repeated block (file:line) and the extraction applied, with a
        before/after length and the gate passing. If the extraction would obscure
        the flow (sometimes it does), say so and leave it -- name the reason
        rather than forcing a worse shape.
      not_applicable: |
        No internal repetition worth extracting. Say so, stop.

  inline-abstraction:
    - id: inline-abstraction.1
      applies_when: |
        The repo has helper functions, utility modules, or wrapper layers.
      hunt: |
        Find indirection that costs more than it saves: a function whose body is
        one line called from one place; a wrapper that only forwards its
        arguments; a utility module of two functions used once each; a named
        constant used once. The test: does the name explain something the call
        site does not, or does it just move the code elsewhere?
      evidence: |
        Each candidate (file:line) with its caller count (show the search), and
        the inline applied where the abstraction earns nothing. Keep any helper
        whose name carries meaning or which has multiple callers -- say which you
        kept and why. Gate must still pass.
      not_applicable: |
        No single-use or pass-through abstractions exist. Say so, stop.

    - id: inline-abstraction.2
      applies_when: |
        The repo has classes, modules, or layers that delegate to one another.
      hunt: |
        Find layers that add no behaviour: a service that only calls its
        repository; a model that only holds fields; a manager wrapping a library
        with no added policy; a base class with one subclass. Each hop costs
        reading time. Look at whether removing the layer would change any
        behaviour or error handling.
      evidence: |
        The delegation chain (file:line for each hop) and what each hop adds (or
        does not). Then collapse the ones that add nothing, keeping any that exist
        for a real reason: a seam for testing, a boundary for a dependency, an
        anticipated variation. Name the reason for each you keep.
      not_applicable: |
        Every layer adds behaviour or a deliberate seam. Name one, stop.

    - id: inline-abstraction.3
      applies_when: |
        The repo defines configuration objects, option structs, or parameter
        bundles.
      hunt: |
        Find options that are declared but barely used, or that exist for a
        flexibility never exercised. Look for: a config object with 12 fields of
        which 2 are set anywhere; a function taking an options dict to pass two
        values through; a parameter always given the same argument at every call
        site (so it is a constant pretending to be a parameter).
      evidence: |
        The options structure (file:line), a field-by-field table of which are
        actually set (with the search as evidence), and the simplification
        applied: remove unused fields, or make always-constant parameters
        constants. State any field kept for an external contract.
      not_applicable: |
        All declared options are used and vary. Say so, stop.

    - id: inline-abstraction.4
      applies_when: |
        The repo has generic machinery: factories, registries, plugin systems,
        decorators, or metaclasses.
      hunt: |
        Find generality built for one case. Look for: a factory that returns one
        type; a registry with one entry; a plugin system with a single plugin; a
        decorator applied to one function; an interface with one implementation.
        Generality has a cost every reader pays; if nothing uses the flexibility,
        the simple version wins. BUT: do not remove a seam that exists to keep a
        boundary clean -- judge by whether variation is planned or real.
      evidence: |
        The machinery (file:line), the count of implementations/entries (show the
        search), and either the simplification or a stated reason to keep it
        (planned variation, external extensibility). Be honest: "we might need it
        later" is worth naming as speculation rather than a reason.
      not_applicable: |
        No generic machinery exists beyond what is used. Say so, stop.

  flatten-nesting:
    - id: flatten-nesting.1
      applies_when: |
        The repo has functions with nesting deeper than three levels.
      hunt: |
        Find the deepest nesting and flatten it with guard clauses: check the
        failure/exit conditions first and return early, so the happy path sits at
        one indent level. Look for: a long if wrapping the whole body; nesting
        caused by validating several preconditions in sequence; a pyramid where
        each level adds one condition.
      evidence: |
        The function (file:line), its current maximum indentation depth, and the
        flattened version with the new depth (count them -- do not estimate).
        Gate must pass. Preserve behaviour exactly: reversal is the one risk, so
        state how you verified the conditions are unchanged.
      not_applicable: |
        No function nests deeper than two levels. Say so, stop.

    - id: flatten-nesting.2
      applies_when: |
        The repo loops over nested structures: collections of collections, trees,
        or recursive walks.
      hunt: |
        Find nested iteration that hides an early exit or a flattening. Look for:
        an inner loop whose result is discarded so only the last iteration
        matters; a nested loop that could be a lookup; a recursive walk that
        carries mutable state down the stack; a double loop doing a membership
        test (O(n*m) that should be a set). Reversing the loops is a common fix
        when the outer one is over a smaller collection.
      evidence: |
        The loop structure (file:line), what the current order costs (state n and
        m where you can), and the flattened/reordered version with the gate
        passing. If behaviour depends on iteration order, say so and keep it.
      not_applicable: |
        No nested iteration over collections exists. Say so, stop.

    - id: flatten-nesting.3
      applies_when: |
        The repo has error handling with nested try/except, or a chain of
        if/elif over the same value.
      hunt: |
        Find exception handling that nests instead of layering. Look for: a
        try inside a try where the outer re-raises generically; an except block
        that itself needs error handling; an if/elif chain comparing one variable
        against many constants (a dict dispatch is flatter and easier to extend);
        a nested finally. Flatter handling makes the recovery path readable.
      evidence: |
        The nested handling (file:line) and the flattened version (early return,
        dict dispatch, a helper per case), with the gate passing. Be careful: a
        nested try is sometimes correct when the inner operation is genuinely
        independent -- say so if you keep it.
      not_applicable: |
        No nested error handling or long if/elif chains exist. Say so, stop.

    - id: flatten-nesting.4
      applies_when: |
        The repo has functions that mix validation, computation, and side effects.
      hunt: |
        Find functions doing several jobs at once, where the nesting is a symptom
        of mixed responsibility. Look for: a function that validates, computes,
        and writes; a handler that parses, decides, and logs; a long function
        where the first third is input checking. The fix is usually to extract the
        validation into a guard function, leaving a flat body.
      evidence: |
        The function (file:line), its line count, the mixed responsibilities
        named, and the extraction applied with before/after line counts and the
        gate passing. Do not split for its own sake: if the parts share state
        heavily, say so and leave it with a reason.
      not_applicable: |
        Functions are single-purpose already. Name one you checked, stop.

  dead-config:
    - id: dead-config.1
      applies_when: |
        The repo has a config file, settings module, or environment variables.
      hunt: |
        Find config keys that nothing reads. For each key, search the WHOLE repo
        for the key name (including as a dict lookup, an attribute access, and a
        string). A key present in the config and absent from the code is dead.
        Watch for indirection: a key read via a loop over all keys, or by a
        library (a framework setting), is alive even without an explicit lookup.
      evidence: |
        A table: key, defined at file:line, the searches run, verdict. Then remove
        the dead keys, or document the ones kept for an external consumer. Note
        the framework keys you decided to keep and why.
      not_applicable: |
        No config file, settings module, or env vars exist. Say so, stop.

    - id: dead-config.2
      applies_when: |
        The repo has a config file with defaults, sample files, or a documented
        format.
      hunt: |
        Find defaults that disagree with each other or with the code. Look for: a
        default in the code differing from the documented default; a sample
        config file that would not actually work (a missing required key); a
        README example that is out of date; a value that must be set but has a
        default implying it is optional. Each disagreement is a trap for the next
        person.
      evidence: |
        Both sides of each disagreement (file:line for each) with the specific
        values, and which one you corrected -- pointing the docs at the code, or
        making the sample actually runnable. State the value before and after.
      not_applicable: |
        No defaults or documented config format exists. Say so, stop.

    - id: dead-config.3
      applies_when: |
        The repo has environment-specific settings: dev vs prod, local vs CI, or
        per-deployment values.
      hunt: |
        Find settings that are wrong or missing outside the environment they were
        written in. Look for: a hard-coded localhost, a local path (C:/Users/...),
        a dev credential, a debug flag left on, a per-developer absolute path, a
        port assumed free. Anything that only works on the author's machine is a
        finding. This is especially relevant for a repo the loop will check out
        and run.
      evidence: |
        Each environment-coupled value (file:line), the environment it requires,
        and what breaks elsewhere. Then a fix: an env var with a documented
        default, a relative path, or a proper config lookup. Do not invent a
        deployment system -- the minimal correct change.
      not_applicable: |
        All settings are environment-neutral. Say so, stop.

    - id: dead-config.4
      applies_when: |
        The repo has configuration that can be set in more than one place.
      hunt: |
        Find precedence that is undefined or surprising: a value settable by CLI,
        env var, and config file, where the winner is not documented and not
        obvious from the code. Look for: config read after the CLI override (so
        the file wins silently); an env var read only if the config key is
        absent, or the reverse; two modules each reading the same key
        differently; a default applied at import time that later code overwrites.
      evidence: |
        The competing sources (file:line each), the ACTUAL winning precedence as
        the code executes it (trace it, do not assume), and the surprising case.
        Then either document the precedence or make it explicit and consistent.
        Where the order matters, demonstrate it by setting two sources to
        different values and observing which is used.
      not_applicable: |
        Every setting has exactly one source. Say so, stop.

  accidental-quadratic:
    - id: accidental-quadratic.1
      applies_when: |
        The repo processes collections that can grow with input size, and has
        loops that nest or that scan inside a loop.
      hunt: |
        Find work that is O(n^2) on data that is realistically large. The
        signature is a membership test, a lookup, or a count inside a loop over
        the same collection: `x in list` inside `for y in list`; finding an item
        per iteration; re-filtering a collection each pass; a list.index() in a
        loop. The fix is usually a dict/set built once. Also look for repeated
        sorting inside a loop, and concatenating strings in a loop (quadratic in
        some languages).
      evidence: |
        The nested work (file:line), the two collections involved with their
        realistic sizes (n and m), and the cost as written -- O(n*m) or O(n^2).
        Then the rewrite with the measured before/after runtime on a REAL input
        of realistic size, or a stated estimate if the data cannot be produced
        here. Do not claim a speedup you did not measure.
      not_applicable: |
        No collection lookup or scan happens inside a loop. Say so, stop.

    - id: accidental-quadratic.2
      applies_when: |
        The repo performs IO -- files, database, network -- and may do it inside
        a loop.
      hunt: |
        Find per-item IO that should be batched: one query per row, one file open
        per record, one HTTP call per item (the classic N+1). Look for: a DB
        query inside a loop over query results; opening/reading the same file
        repeatedly; an HTTP request per element of a list; a directory listing
        repeated instead of cached. IO latency multiplies, so this is usually the
        most expensive finding in the repo.
      evidence: |
        The per-item IO (file:line), the loop it sits in, and the resulting call
        count for a realistic input (state n). Then a batched version: one query
        with an IN clause, one bulk read, one cached lookup. Measure the call
        count before/after (instrument it) or at minimum count the sites.
      not_applicable: |
        The repo performs no IO inside a loop. Say so, stop.

    - id: accidental-quadratic.3
      applies_when: |
        The repo builds strings, serialises data, or grows buffers incrementally.
      hunt: |
        Find incremental building that reallocates. Look for: string += in a loop
        over many items; repeated concatenation of bytes; a list extended one
        element at a time where a comprehension would do; building a large
        structure by copying it each iteration (immutable collections are prone
        to this). Confirm the scale: is the loop over 5 items or 50,000?
      evidence: |
        The construction (file:line), the iteration count it runs over, and the
        rewrite (join/append/extend). Include a measured time for both versions
        on a realistic input if you can run it -- otherwise state the loop bound
        and the complexity, and mark the impact as unmeasured.
      not_applicable: |
        No incremental building exists, or every loop is over a tiny fixed set.
        Say so, stop.

    - id: accidental-quadratic.4
      applies_when: |
        The repo has recursive functions, tree/graph walks, or memoisation.
      hunt: |
        Find recursion that recomputes the same work, or that walks the same node
        repeatedly. Look for: a recursive function with no memo where the call
        tree branches (exponential); a graph walk with no visited set; a tree
        traversal that re-fetches children at each level; mutual recursion that
        revisits. Exponential blowup is invisible on small inputs and fatal on
        larger ones.
      evidence: |
        The recursion (file:line), the branching factor, and the growth as input
        grows -- measure the call count or the runtime for two sizes to show the
        curve (this is the proof). Then memoisation or a visited set, with the
        same two sizes measured again. If the input is always tiny in practice,
        say so and stop.
      not_applicable: |
        No recursion or graph traversal exists. Say so, stop.

  repeated-work:
    - id: repeated-work.1
      applies_when: |
        The repo computes a value that depends on other values, and calls that
        computation from more than one place.
      hunt: |
        Find identical computation repeated instead of shared. Look for: the same
        derived value recomputed by several callers; a lookup performed per call
        that could be resolved once; a regex compiled inside a function that runs
        often; an expensive parse repeated per request; a default constructed
        fresh each call. The tell is the same inputs producing the same output
        with no cache.
      evidence: |
        The repeated computation (file:line for each site), how many times it
        runs for one realistic operation, and the hoist/cache applied. Measure
        the call count or time before/after, or state the call count if you
        cannot time it. Do not introduce a cache without saying what invalidates
        it.
      not_applicable: |
        No computation is repeated across call sites. Say so, stop.

    - id: repeated-work.2
      applies_when: |
        The repo reads the same external resource more than once: a config file,
        a directory listing, an environment value, a remote fetch.
      hunt: |
        Find reads repeated where one read would serve. Look for: a config file
        re-read on every request; the same directory listed repeatedly;
        environment read per call; a remote resource fetched twice in one code
        path (once for a count, once for the data); the same file stat'd in a
        loop.
      evidence: |
        The read (file:line for each occurrence), how often it happens per
        operation, and the single-read fix with the invalidation policy stated
        (when does the cache expire?). Where a repeated read is deliberate
        (freshness matters), say so and leave it.
      not_applicable: |
        No external resource is read more than once per operation. Say so, stop.

    - id: repeated-work.3
      applies_when: |
        The repo has overlapping code paths: shared helpers called in sequence by
        different callers.
      hunt: |
        Find work done twice in one flow because two layers each perform it: the
        caller validates and the callee re-validates; a wrapper normalises and
        the inner function normalises again; a serializer called on already-
        serialised data; a sort applied to an already-sorted list. Redundancy is
        not always wrong (defence in depth), so judge: is the second pass
        protecting against a real external caller, or pure duplication?
      evidence: |
        Both sites (file:line) and the flow that hits both, with the cost
        (measurable or counted). Then remove the redundant pass, or keep it and
        state the reason (an external contract). Be explicit about which you
        chose.
      not_applicable: |
        No flow performs the same work twice. Say so, stop.

    - id: repeated-work.4
      applies_when: |
        The repo handles many similar operations where setup could be shared:
        connections, clients, parsed resources, or handles.
      hunt: |
        Find setup repeated per operation that could be done once. Look for: a
        new client/connection per call instead of reuse or pooling; re-parsing a
        large template per render; recompiling a regex or template per use;
        re-running a migration check on every request; re-reading a model file
        per invocation. The cost is the setup, not the operation.
      evidence: |
        The repeated setup (file:line), its cost per call, and the number of
        calls in a realistic operation. Then the shared/pooled version with the
        lifecycle made explicit (when is it created, when disposed). Measure or
        count; do not assert a speedup you did not observe.
      not_applicable: |
        No per-operation setup could reasonably be shared. Say so, stop.

  unbounded-memory:
    - id: unbounded-memory.1
      applies_when: |
        The repo holds data in memory whose size is chosen by input rather than
        by the code.
      hunt: |
        Find memory that scales with input and has no ceiling. Look for: reading
        a whole file into memory to process it; building a full result set before
        writing anything; an unbounded queue or buffer; caching every distinct
        input seen; accumulating all records to compute a single value that could
        be computed incrementally.
      evidence: |
        The allocation (file:line), what determines its size, and a measurement
        at a realistic input (peak memory for an N-byte or N-row input if you can
        produce one). Then a streaming/incremental/most-bounded rewrite. If the
        domain guarantees small inputs, say so as the reason to leave it.
      not_applicable: |
        All in-memory data is bounded by the code. Say so, stop.

    - id: unbounded-memory.2
      applies_when: |
        The repo runs as a long-lived process (server, daemon, game loop).
      hunt: |
        Find memory that grows across the process lifetime even when load is
        constant. Look for: caches without eviction; per-request state retained
        in a module global; listeners registered per request and never removed;
        a memo keyed by an ever-changing input; objects appended to a list that
        is never trimmed. The test: run it under repeated identical load and see
        if memory returns to baseline.
      evidence: |
        The growing structure (file:line), what adds to it, and any measurement
        you can make across repeated iterations (RSS before/after N operations).
        Then a bound (LRU, maxlen, explicit eviction). If you cannot run the
        process, state clearly that the growth is inferred from the absence of a
        removal path, with the path shown.
      not_applicable: |
        No cross-request state is retained. Say so, stop.

    - id: unbounded-memory.3
      applies_when: |
        The repo deserialises input: JSON, pickle, archive, or a database blob.
      hunt: |
        Find deserialisation with no size or depth limit. Look for: parsing a
        document before checking its size; unpickling untrusted data (also a
        security issue); archive extraction with no entry-count or expansion cap
        (zip bomb); recursive JSON with no depth limit; loading a DB blob that
        could be arbitrarily large.
      evidence: |
        The deserialisation (file:line), the input that makes it large (state the
        size), and a limit applied before the parse. For an archive, name the
        expansion ratio you would accept and why. Where the data is trusted
        (written by the same process moments earlier), say so and stop.
      not_applicable: |
        No unbounded deserialisation exists. Say so, stop.

    - id: unbounded-memory.4
      applies_when: |
        The repo builds collections from queries, API pages, or directory walks.
      hunt: |
        Find gather-everything-first patterns. Look for: fetching all pages
        before processing any; listing a whole directory recursively into a list;
        SELECT * with no LIMIT into memory; building one big list to sort when a
        generator or a DB sort would do. The failure needs a large dataset to
        appear, which is exactly why it ships.
      evidence: |
        The gather (file:line), what determines the total count, and the realistic
        ceiling in this domain (name it). Then pagination/streaming/chunking, or a
        stated bound with the reason. If the dataset is provably small, say so and
        stop rather than adding machinery.
      not_applicable: |
        No unbounded gathering exists. Say so, stop.

  slow-startup:
    - id: slow-startup.1
      applies_when: |
        The repo is a service, CLI, or app with a start-up path.
      hunt: |
        Find what makes startup slow. Measure first: time the start-up and break
        it down before proposing anything. Then look for: eager imports of heavy
        libraries that are only needed later; a model or dataset loaded at import
        time; a network call during start; scanning a large directory; loading
        every plugin/module even when unused; building an index eagerly.
      evidence: |
        The ACTUAL startup time and where it goes -- a breakdown with real
        numbers (a profiler, or timed checkpoints), not an impression. Then a
        lazy/deferred change, and the new measured startup time. If you cannot
        measure it, say so and report the top candidate by weight of imports.
      not_applicable: |
        Startup has no measurable delay, or the repo has no start-up path. Say
        so, stop.

    - id: slow-startup.2
      applies_when: |
        The repo imports modules, and the import graph may be deep or eager.
      hunt: |
        Find import-time cost: heavy modules imported but rarely used; a package
        whose __init__ imports every submodule (so importing one loads all); a
        module performing side effects at import (opening a connection, reading a
        file, registering globally). Measure the import time of the heaviest
        modules to rank them rather than guessing.
      evidence: |
        The import (file:line) with its MEASURED import cost (time each module),
        and the lazification applied (import inside the function, a deferred
        registry). New measured import time for the affected path. Report the
        numbers you took.
      not_applicable: |
        Imports are cheap and no import-time side effects exist. Show the timing
        you took, stop.

    - id: slow-startup.3
      applies_when: |
        The repo reads configuration, builds indexes, or scans directories at
        start-up.
      hunt: |
        Find start-up work whose scale depends on the environment rather than the
        code: scanning a directory with thousands of entries; reading a large
        config; building a full index before serving; enumerating a big inventory;
        connecting to several services serially. The failure appears only on the
        user's real machine with real data.
      evidence: |
        The work (file:line), its scale (how many entries/files/bytes -- measure
        on real data if available), and the resulting delay. Then a fix: lazy,
        parallel, incremental, or cached. State the measured or counted scale --
        do not report a delay without a basis.
      not_applicable: |
        Nothing at start-up scales with the environment. Say so, stop.

    - id: slow-startup.4
      applies_when: |
        The repo performs network calls or external checks at start-up.
      hunt: |
        Find start-up that blocks on the network: a health check against a remote
        service; a version check; downloading a model or resource; a licence or
        telemetry call; resolving many hosts. A slow or unreachable peer then
        makes the app appear broken. Look also for missing timeouts on these
        calls.
      evidence: |
        The start-up call (file:line), its timeout setting (or the absence), and
        what happens when the peer is unreachable -- test it if you can. Then a
        fix: move it off the start path, add a short timeout, or make it optional
        with a clear degraded mode.
      not_applicable: |
        No network call occurs at start-up. Say so, stop.

  argue-for-deletion:
    - id: argue-for-deletion.1
      applies_when: |
        The repo contains a feature, option, or module that looks unused or
        unjustified.
      hunt: |
        Build the strongest possible case that it should be DELETED, then test
        that case honestly. Gather: who calls it (a real search), when it was
        introduced and why (git log), whether tests cover it, whether docs
        mention it, whether an external consumer could depend on it. Then argue
        both sides: what is lost if removed, what is paid by keeping it. The
        deliverable is a verdict with evidence, not a removal.
      evidence: |
        The candidate (file:line), the usage search results, the git history
        summary, and a written verdict: DELETE (with the case) or KEEP (with what
        would break). If DELETE, do it and show the gate passing. If KEEP, name
        the specific dependency or contract that justified it. If you cannot
        determine it, say what information would settle it -- do not guess.
      not_applicable: |
        You find nothing unjustified after a real search. Report the candidates
        you examined and why each survived, stop.

    - id: argue-for-deletion.2
      applies_when: |
        The repo has defensive code: validation, retries, guards, or fallbacks.
      hunt: |
        Argue that a specific piece of defence is unnecessary, then try to refute
        your own argument. Identify what threat it guards against, then ask
        whether that threat is reachable in THIS system (trace the callers -- is
        untrusted input actually possible?). Defensive code kept for an
        unreachable threat is the commonest rot; defensive code removed for a
        reachable one is the commonest outage. Be rigorous about which.
      evidence: |
        The defence (file:line), the threat it names, the reachability analysis
        (can untrusted input arrive? show the call path or its absence), and a
        verdict. If unreachable, remove it and show the gate passing. If
        reachable, state the input path explicitly and keep it.
      not_applicable: |
        Every defence has a documented reachable threat. Name one, stop.

    - id: argue-for-deletion.3
      applies_when: |
        The repo has abstractions: base classes, interfaces, wrappers, or
        configuration layers.
      hunt: |
        Argue that a specific abstraction should be removed and replaced with the
        direct code. Count its users and implementations, then ask whether the
        indirection buys anything today (a seam for tests, a real second
        implementation, a boundary against a dependency). If it buys nothing, the
        direct version is better: less to read, less to get wrong.
      evidence: |
        The abstraction (file:line), its user/implementation counts (show the
        search), what it buys today, and a verdict with the reasoning. If you
        remove it, show the gate passing and the line-count change. If you keep
        it, name the concrete seam it provides.
      not_applicable: |
        Every abstraction has multiple real users. Show the counts, stop.

    - id: argue-for-deletion.4
      applies_when: |
        The repo has grown features, files, or options over many commits, and
        some may be cruft.
      hunt: |
        Pick the file or module with the highest ratio of lines to demonstrated
        purpose and argue it should go. Measure: how many lines, how many are
        reachable from any entry point, how many are covered by tests, how many
        changed in the last N commits. A file that is large, untested, and
        untouched is usually dead. Check git log to see whether it is recent (in
        flux) or abandoned.
      evidence: |
        The candidate (file:line range), its measured stats (lines, reachable
        share, test coverage if available, last-modified date), the git history
        summary, and a verdict. If DELETE, do it with the gate passing. If KEEP,
        name what would break and the evidence it is live.
      not_applicable: |
        No file shows a large lines-to-purpose gap. Report your measurements for
        the top two candidates, stop.

  generalise-last-fix:
    - id: generalise-last-fix.1
      applies_when: |
        The repo's recent history contains a fix for a specific reported case.
      hunt: |
        Find the CLASS behind the last fix. Read the most recent fix commit (git
        log -1 with its diff), identify what it special-cased, then search for
        the same SHAPE elsewhere in the codebase: the same operation on a
        different input, the same guard in a sibling function, the same
        assumption in another module. A fix applied at one site usually has
        siblings. Do NOT add the specific case to a list -- close the class.
      evidence: |
        The fix commit (hash + the line it changed), the class it belongs to
        named in one sentence, and the sibling sites you found (file:line each).
        Then the general fix applied, with tests covering at least two members of
        the class (not just the originally-reported one). Show the gate passing.
      not_applicable: |
        The last fix is genuinely local to one call site. Say which commit and
        why, stop.

    - id: generalise-last-fix.2
      applies_when: |
        The repo contains hand-maintained lists, allowlists, denylists, or
        enumeration tables.
      hunt: |
        Find lists that will need editing again. A list of special cases is
        usually a rule that was never written. For each entry, ask: what do these
        have in common that the code could test directly? Look for: a list of
        exempt names, a set of magic strings, an enum extended per bug report, an
        if/elif chain of cases. Adding to such a list is never progress.
      evidence: |
        The list (file:line), its entries, the common property they share, and
        the structural test that replaces them -- or a stated reason the list
        must stay (genuinely arbitrary data has no rule). Show the gate passing
        with the structural version, and confirm the original cases still work.
      not_applicable: |
        No hand-maintained case lists exist. Say so, stop.

    - id: generalise-last-fix.3
      applies_when: |
        The repo has validation, parsing, or classification logic.
      hunt: |
        Find logic that handles the instances it has seen rather than the
        category. Look for: a parser that handles the formats in its test file
        but not the shape they generalise to; a validator listing accepted values
        instead of stating the acceptance rule; a classifier with a branch per
        observed input. Test with a NEW member of the same category that is not
        in the tests -- if it fails, the logic is instance-shaped.
      evidence: |
        The logic (file:line), the new input you tested with, and its ACTUAL
        result (paste it) -- showing either the gap or that it already
        generalises. Then the structural fix, with the new input added as a test.
        If it already generalises, say so with the input as proof.
      not_applicable: |
        Validation and parsing are already rule-based. Show the rule, stop.

    - id: generalise-last-fix.4
      applies_when: |
        The repo has a documented or recently-reported bug class, and no test
        pins it.
      hunt: |
        Take the most recently fixed bug and ask: does a test now prevent its
        RETURN? Look for: a fix with no accompanying test; a test that pins the
        exact reported input rather than the class; a bug fixed in one code path
        while a sibling path is untested. A fix without a test is a fix that will
        regress. This angle is about durability, not new bugs.
      evidence: |
        The fix commit and whether a test covers it (show the test or its
        absence). Then add the missing test, covering the CLASS (at least two
        inputs), and demonstrate it fails against the pre-fix code if you can
        reconstruct it -- or state that you could not. Gate must pass.
      not_applicable: |
        Every recent fix is covered by a test. Name two and their tests, stop.

  assumption-audit:
    - id: assumption-audit.1
      applies_when: |
        The repo has code that depends on invariants: "this is always true",
        "this never happens", "this is set before that".
      hunt: |
        Find assumptions stated or implied by the code and test each one. Look
        for: a comment asserting an invariant; an unchecked precondition; an
        ordering dependency between modules; an assumption that a value is
        non-empty, unique, sorted, or small; an assumption about the environment
        (a file exists, a port is free, a command is on PATH). For each, decide
        whether the code ENFORCES it or merely hopes for it.
      evidence: |
        The assumption (file:line, quote the comment or the code), what enforces
        it (or the absence), and a concrete input/state that violates it -- with
        the resulting behaviour if you can trigger it. Then enforce it (an assert
        with a message, a validation, a guard) or document it. Prefer an explicit
        failure over a silent wrong result.
      not_applicable: |
        All invariants are enforced at their boundaries. Show one enforcement,
        stop.

    - id: assumption-audit.2
      applies_when: |
        The repo parses, validates, or consumes data from outside itself.
      hunt: |
        Find assumptions about input that the code does not verify: that a field
        is present, that a value is in range, that a collection is non-empty,
        that an ID exists, that a string is ASCII, that a number is an integer.
        The test is whether the validator ENFORCES it or whether a downstream
        use merely assumes it. These assumptions are where crashes live.
      evidence: |
        The assumption (file:line where it is relied on), the validation that
        fails to cover it (file:line of the validator, showing the gap), and an
        input that violates it with the resulting behaviour. Then move the check
        to the boundary. Show the violating input as a test.
      not_applicable: |
        Input validation covers every downstream assumption. Show the validator,
        stop.

    - id: assumption-audit.3
      applies_when: |
        The repo has configuration, environment, or deployment assumptions.
      hunt: |
        Find environmental assumptions that are unverified: a working directory;
        a writable path; an installed binary; a required env var; a locale or
        encoding; a timezone; a case-sensitive filesystem; a specific Python/
        Node/runtime version. Check whether the code fails CLEARLY when the
        assumption breaks, or merely misbehaves. A missing env var should say so
        by name, not produce a confusing downstream error.
      evidence: |
        The assumption (file:line), what happens when it is violated (test it on
        a copy where safe), and a fix: an explicit check with a clear message at
        start-up. Where the runtime already guarantees it, say so and skip.
      not_applicable: |
        No environmental assumptions exist beyond documented requirements. Say
        so, stop.

    - id: assumption-audit.4
      applies_when: |
        The repo has state that must be consistent: caches, indexes, denormalised
        copies, or derived values.
      hunt: |
        Find assumptions that a derived value stays in sync with its source.
        Look for: a cache assumed fresh; a denormalised field assumed accurate; a
        count assumed to match its collection; an index assumed complete; a
        derived value recomputed only at write time. Each is a correctness bug
        waiting for the first out-of-band update. Ask what would invalidate it and
        whether anything actually does.
      evidence: |
        The derived value and its source (file:line each), the mutation path that
        would desync them (name it), and a concrete sequence producing a
        mismatch -- show the numbers if you can construct it. Then recompute
        instead of store, or fix the invalidation. State the tradeoff you chose.
      not_applicable: |
        No derived or cached state exists. Say so, stop.

  dependency-audit:
    - id: dependency-audit.1
      applies_when: |
        The repo has a dependency manifest: requirements.txt, package.json,
        pyproject.toml, go.mod, Cargo.toml, or similar.
      hunt: |
        Find dependencies that are declared but unused, or used but undeclared.
        For each declared package, search the codebase for a real import (not a
        mention in a manifest or lockfile). For undeclared usage, look for an
        import that resolves only because another package happens to pull it in --
        that breaks the moment the transitive dependency changes. Also check for
        dependencies that duplicate the standard library.
      evidence: |
        A table: package -> declared? -> imported? -> (if imported) file:line ->
        verdict. Then remove the unused ones and run the FULL test suite to prove
        nothing broke (an unused dependency is invisible until removed). List any
        undeclared-but-used import as a finding with the file:line.
      not_applicable: |
        No dependency manifest exists. Say so, stop.

    - id: dependency-audit.2
      applies_when: |
        The repo has dependencies with version constraints.
      hunt: |
        Find constraints that are unpinned, contradictory, or dangerously loose.
        Look for: no version specified at all (a build that is not reproducible);
        a range wider than tested (^1.0.0 where only 1.4 is tested); two
        requirements that conflict; a dev tool and a runtime package requiring
        incompatible versions of a shared dependency; a lockfile that disagrees
        with the manifest. Note which of these the project actually ships.
      evidence: |
        The constraint (file:line), what it permits, and the specific version
        that would break the code -- name it if you can determine it, or state
        that you could not. Then tighten the constraint or pin the lockfile. If
        the project is an application (not a library), pinning exactly is correct;
        say which this is.
      not_applicable: |
        All dependencies are exactly pinned and consistent. Show the manifest
        style, stop.

    - id: dependency-audit.3
      applies_when: |
        The repo's dependencies are installed and importable.
      hunt: |
        Find version drift between what is declared and what is actually
        installed, and check whether a declared API is actually used. Look for: an
        installed version outside the declared range; a code path calling a
        function that does not exist in the installed version (would fail at
        runtime, not import); a deprecated API used where the version warns; a
        transitive dependency pinned by accident. Cross-check the manifest against
        the actual installed metadata.
      evidence: |
        The package, the declared range (file:line), the INSTALLED version (show
        the command output you used to get it), and any drift. If a called API
        does not exist in the installed version, that is a live bug -- name the
        call site. Report what you found; do not upgrade anything without saying
        so explicitly.
      not_applicable: |
        Declared and installed versions agree and no deprecated APIs are used.
        Show the comparison, stop.

    - id: dependency-audit.4
      applies_when: |
        The repo has a lockfile, vendored code, or a build that resolves
        dependencies at build time.
      hunt: |
        Find reproducibility failures: a build that would resolve differently
        tomorrow. Look for: a lockfile out of date with the manifest (so CI and
        local disagree); no lockfile committed at all for an application; a
        dependency fetched from a URL rather than a registry (the URL can change);
        a version range that permits a new major; a transitive dependency not
        locked. The test is whether a fresh clone today builds identically to one
        from a month ago.
      evidence: |
        The reproducibility gap (file:line for the manifest/lockfile), what
        differs, and a fix: commit the lockfile, pin the URL with a hash, or
        narrow the range. If the repo has no lockfile and cannot have one, state
        that and the practical risk.
      not_applicable: |
        The build is fully reproducible from committed files. Show the lockfile
        and state you verified agreement, stop.

  unactionable-error:
    - id: unactionable-error.1
      applies_when: |
        The repo surfaces errors to a human: messages, logs a user reads,
        dialogs, or API error responses.
      hunt: |
        Find messages that tell the user something failed without telling them
        what to do. For each, ask: could a competent user act on this? Look for:
        a bare exception string, a stack trace shown to a user, "an error
        occurred", "invalid input" with no field named, a generic error code with
        no lookup, a message naming an internal concept (a class, a table, a
        variable) rather than the user's concept.
      evidence: |
        A table of messages (file:line + the literal text) with the verdict:
        actionable or not. For each non-actionable one, the rewritten message
        naming (a) what failed in user terms, (b) why, (c) what to do next. Apply
        the rewrites. If a message goes only to a developer log, say so and skip.
      not_applicable: |
        The repo surfaces no errors to humans. Say so, stop.

    - id: unactionable-error.2
      applies_when: |
        The repo validates user input: forms, CLI arguments, API bodies, or
        config files.
      hunt: |
        Find validation failures that do not identify the offending input. Look
        for: "invalid request" with no field named; a validation error reporting
        the rule but not the value; a parse error with a line but no column; a
        config error naming the key but not the file; a reject that does not echo
        what was received. The user's first question is always "which one?".
      evidence: |
        Each vague rejection (file:line + literal text) and its rewrite naming
        the field, the received value, the expected shape, and the location. Show
        a before/after for at least three. If the value must not be echoed
        (a secret), say so and name the field only.
      not_applicable: |
        The repo validates no user input, or every rejection already names the
        input. Show one, stop.

    - id: unactionable-error.3
      applies_when: |
        The repo has failures that can be caused by the environment: a missing
        file, an unreachable service, a permission problem, a missing dependency.
      hunt: |
        Find environment failures reported as generic errors. These are the cases
        where the fix is entirely outside the code, so the message must say
        exactly what is wrong out there. Look for: a file-not-found reported as
        "load failed"; a connection refused surfaced as a validation error; a
        permission denial reported as a parse failure; a missing binary reported
        as a generic process error.
      evidence: |
        Each site (file:line), the misleading message, and the rewrite naming the
        external cause and the remedy ("could not read X at PATH -- check it
        exists and is readable"). Where you can, trigger the failure and show the
        message as it actually appears.
      not_applicable: |
        The repo has no environment-caused failures, or they already report
        clearly. Say so, stop.

    - id: unactionable-error.4
      applies_when: |
        The repo writes logs or error records an operator would use to diagnose a
        problem.
      hunt: |
        Find log entries that omit the context needed to diagnose. Look for: an
        exception logged without the operation or identifier it was performing;
        an error logged with no timestamp or correlation id; the same error
        logged at both call sites with no distinguishing detail; a caught error
        logged at debug level when it should be a warning (so it is invisible in
        production); a message with no value, only the shape ("failed to
        process").
      evidence: |
        Each deficient log site (file:line + the call), what an operator would be
        missing, and the improved call adding the identifier, the operation and
        the level. Show the before/after for at least three sites. Name the log
        level you chose and why.
      not_applicable: |
        The repo writes no diagnostic logs. Say so, stop.

  too-many-steps:
    - id: too-many-steps.1
      applies_when: |
        The repo has a user interface -- web, TUI, desktop, or CLI with multiple
        commands.
      hunt: |
        Find a common intent that takes more steps than it should. Pick a real
        goal a user would have (start the thing, find a record, change a setting)
        and COUNT the actions required, exactly. The classic findings: 5 clicks
        for a 1-click intent; retyping the same value on consecutive screens;
        navigating away and back for a routine task; a CLI requiring three
        subcommands for one operation.
      evidence: |
        The intent, the exact step count as it is today (list each step), and a
        reduced path with its new count -- show both. Then implement the shorter
        path. If the extra steps exist for a real safety reason, say so and do not
        remove them.
      not_applicable: |
        The repo has no user interface. Say so, stop.

    - id: too-many-steps.2
      applies_when: |
        The repo has repeated data entry: the same value typed or configured in
        more than one place.
      hunt: |
        Find repetition the system could remember: a setting re-entered per
        session; a path/credential/identifier retyped; the same choice made
        repeatedly. Look for: no default remembered between runs; a required
        parameter that is almost always the same; a config value duplicated in
        two files; a CLI requiring a flag that could be inferred.
      evidence: |
        The repeated entry (file:line), how often a user must repeat it, and the
        fix: remember the last value, infer a default, or read it from one place.
        Show the before/after interaction. If repetition is deliberate (explicit
        confirmation of something dangerous), say so and stop.
      not_applicable: |
        No repeated data entry exists. Say so, stop.

    - id: too-many-steps.3
      applies_when: |
        The repo has a start-up, setup, or onboarding path.
      hunt: |
        Find setup steps that could be automated or removed. Count what a new
        user must do before first success. Look for: manual file copying;
        environment variables that could have defaults; a script that could
        create scaffolding; documented steps that the code could perform; a
        multi-step install where one command would do.
      evidence: |
        The full setup sequence as a numbered list (with where each step is
        documented, file:line), and a reduced sequence with the automated steps
        implemented or scripted. Keep any step that requires a genuine human
        decision (a credential, a choice). State which you removed and which you
        kept, and why.
      not_applicable: |
        Setup is a single step already. State it, stop.

    - id: too-many-steps.4
      applies_when: |
        The repo has workflows where a user must find something before acting on
        it: search, then select, then edit.
      hunt: |
        Find flows where the system makes the user locate something it already
        knows. Look for: a required ID/path a user must copy from elsewhere; a
        list that must be searched manually for a known item; a confirmation loop
        where the system could act directly; navigation to a thing the user just
        created. The fix is usually to carry context forward through the flow.
      evidence: |
        The flow (file:line for each hop), the step where the user is made to look
        something up, and the change that carries it forward. Show the before/
        after step count. If the lookup is a deliberate confirmation, say so and
        stop.
      not_applicable: |
        No flow requires a lookup the system already knows. Say so, stop.

  invisible-state:
    - id: invisible-state.1
      applies_when: |
        The repo has state a user depends on: a mode, a connection status, a
        pending job, a save state, or a selection.
      hunt: |
        Find state that affects behaviour but is not visible. The test: can the
        user tell what state they are in RIGHT NOW? Look for: a mode toggled with
        no indicator; a background job with no progress or completion signal; a
        disconnected/degraded state that looks the same as healthy; a save that
        happened or failed with no confirmation; a filter still applied with no
        indication.
      evidence: |
        The state (file:line where it changes), how the user would know today
        (or the proof they cannot), and the indicator added: a label, a badge, a
        status line, a message. Show where it now appears. If the state is
        discoverable another way, say so and leave it.
      not_applicable: |
        All user-relevant state is already visible. Name two examples, stop.

    - id: invisible-state.2
      applies_when: |
        The repo performs operations that take noticeable time or can fail
        silently.
      hunt: |
        Find operations with no feedback while they run. Look for: a long
        operation with no spinner, progress, or "working" message (the interface
        looks frozen); a background operation that fails with no visible error; a
        queue that grows with no depth shown; an operation that partially
        succeeded with no report of what completed.
      evidence: |
        The operation (file:line), its realistic duration, and what the user sees
        meanwhile (or the proof they see nothing). Then the feedback added, and
        the actual appearance. If the operation is always instant, say so and
        stop.
      not_applicable: |
        No user-visible operation takes noticeable time. Say so, stop.

    - id: invisible-state.3
      applies_when: |
        The repo lets a user affect state they may later need to understand or
        undo: a change, a deletion, a submission, a submission of work.
      hunt: |
        Find actions whose consequences are not shown. Look for: a destructive
        action with no confirmation of what was destroyed; an edit with no diff or
        summary; a submit with no receipt; an apply/commit with no indication of
        what changed; an undo with no indication of what it restored. The user
        should be able to reconstruct what just happened.
      evidence: |
        The action (file:line), what the user can learn afterwards today, and the
        confirmation or summary added (naming the affected items and the count).
        For a destructive action, state exactly what the confirmation says before
        and after.
      not_applicable: |
        All consequential actions already report their effect. Show one, stop.

    - id: invisible-state.4
      applies_when: |
        The repo has selection, focus, filters, or active context (a current
        project, record, or mode).
      hunt: |
        Find active context the user cannot see. Look for: a selected item with
        no visual indication; a list still filtered with no chip or label; a
        default applied invisibly (the user thinks they chose it); a current
        context shown only in the title, not near the action it affects. The
        failure mode is acting on the wrong context.
      evidence: |
        The context (file:line where it is set), why it is ambiguous today, and
        the indication added near where it matters. Show the before/after. If the
        context is unambiguous by construction, say so and stop.
      not_applicable: |
        No hidden selection or filter state exists. Say so, stop.

  unreadable-text:
    - id: unreadable-text.1
      applies_when: |
        The repo renders text to a human: HTML, a TUI, a document, or a game
        interface.
      hunt: |
        Find text that cannot be read comfortably: contrast too low, size too
        small, line length excessive, all-caps blocks, long unbroken strings,
        jargon, or truncation without an ellipsis. In a TUI or terminal, check
        colour pairs that collide and text that assumes a white background. Copy
        the actual style values (colour codes, font sizes) as evidence rather
        than judging by eye alone.
      evidence: |
        The style (file:line with the literal values, e.g. a hex colour and a
        font size), the computed contrast ratio where it applies (calculate it;
        WCAG AA is 4.5:1 for body text), and the corrected values. For terminal
        output, name the colour pair and the terminal that renders it badly.
      not_applicable: |
        The repo renders no text to humans. Say so, stop.

    - id: unreadable-text.2
      applies_when: |
        The repo produces messages, notifications, logs, or reports a human
        reads.
      hunt: |
        Find wording that obscures meaning: internal jargon, an abbreviation
        defined nowhere, an all-caps wall, a wall of text with no structure, a
        message that buries the actionable part at the end, a number with no
        units, a wall of numbers with no formatting. Read each as the intended
        audience, not as the author.
      evidence: |
        The text (file:line + literal), why it is hard to read, and the rewrite.
        For a long block, show the restructured version (the key fact first).
        Preserve any exact identifiers (paths, codes, ids) -- those must remain
        verbatim.
      not_applicable: |
        No human-readable text output exists. Say so, stop.

    - id: unreadable-text.3
      applies_when: |
        The repo displays data: tables, lists, numbers, dates, or statuses.
      hunt: |
        Find data presented in a form that hides the signal: unaligned numeric
        columns, mixed units in one column, an unformatted raw value where a
        human form is needed (an epoch timestamp, a raw byte count, a long
        integer), a status shown as a raw code, an empty value rendered as blank
        rather than a dash, an over-long value pushing the layout. Sorting that is
        not applied where the reader expects it is a close cousin.
      evidence: |
        The rendering (file:line), the raw value, and the formatted version
        (thousands separators, human units, a real date). Show a before/after of
        the actual output for at least three values. Keep machine-readable
        identifiers unchanged.
      not_applicable: |
        The repo displays no structured data. Say so, stop.

    - id: unreadable-text.4
      applies_when: |
        The repo has user-facing text that must work for users of different
        abilities, devices, or languages.
      hunt: |
        Find text that breaks for someone other than the author. Look for:
        meaning conveyed ONLY by colour (a red/green status with no label); text
        in an image with no alt text; a layout that breaks at a narrow width or a
        larger font; a fixed-width container that clips long words; a string
        concatenated from fragments that only makes sense in English word order;
        a number or date formatted for one locale only. These are real failures
        for real users.
      evidence: |
        Each issue (file:line), the specific user who would be blocked, and the
        fix (a label alongside the colour, alt text, a wrapping layout, a locale-
        aware format). Where you can, show the fixed rendering at a constrained
        width or a larger font size.
      not_applicable: |
        No user-facing text exists beyond plain single-locale strings. Say so,
        stop.

  unsafe-destructive:
    - id: unsafe-destructive.1
      applies_when: |
        The repo can delete, overwrite, reset, or irreversibly modify user data.
      hunt: |
        Find destructive operations with no confirmation and no undo. For each,
        ask: if this runs by mistake, what is lost, and how would the user
        recover? Look for: a delete with no confirmation; an overwrite with no
        backup; a reset with no export first; a bulk operation acting on
        everything matched with no count shown; a destructive default (the
        dangerous option preselected).
      evidence: |
        The operation (file:line), the worst case if triggered accidentally, and
        the safeguard: a confirmation naming what will be destroyed and how many,
        an undo/backup, or a safer default. State precisely what the user now
        sees before the operation proceeds.
      not_applicable: |
        The repo performs no destructive operations. Say so, stop.

    - id: unsafe-destructive.2
      applies_when: |
        The repo writes to paths, files, or directories derived from input.
      hunt: |
        Find writes that can land outside the intended location. Look for: a path
        built by joining untrusted input without normalising (../ escapes); a
        delete applied to a directory built from a variable; a wildcard widened
        by unexpected input; an operation on a path that could be the root, home,
        or a parent directory. Test with a traversal input and observe where the
        write actually goes.
      evidence: |
        The path construction (file:line) and the traversal input you tested,
        with the ACTUAL resulting path outside the intended root (show it). Then
        a normaliser/resolver with a containment check. If the input can never be
        attacker-controlled, say so and stop.
      not_applicable: |
        No input-derived paths are written to. Say so, stop.

    - id: unsafe-destructive.3
      applies_when: |
        The repo handles commands, scripts, queries, or templates built from
        input.
      hunt: |
        Find construction that lets input change the operation: shell command
        injection, SQL concatenation, template injection, or a query built by
        string joining. Look for: a subprocess with shell=True and an
        interpolated string; an f-string passed to a shell; a SQL statement built
        by concatenation rather than parameters; a file path interpolated into a
        command; an eval/exec of anything derived from input. Note: this projects
        own tooling has met this class -- judge it honestly.
      evidence: |
        The construction (file:line), an input that changes the operation (test
        it safely on a sandboxed command if possible, and show the output), and
        the parameterised fix (argument list, a bound query, a template with
        escaped values). Never show an actually harmful payload executed against
        a live system.
      not_applicable: |
        No command, query, or template is built from input. Say so, stop.

    - id: unsafe-destructive.4
      applies_when: |
        The repo runs automatically: a scheduled job, a cron, a watcher, a
        start-up routine, or a loop.
      hunt: |
        Find destructive or surprising work performed without a human present.
        Look for: an automatic cleanup that deletes data matching a pattern; a
        start-up routine that overwrites state; a scheduled job with no dry-run
        and no journal; a watcher that acts on partial files; an automatic retry
        that re-sends an irreversible operation; anything that mutates shared
        files without a lock. The user is not watching, so the failure is silent.
      evidence: |
        The automatic operation (file:line), the trigger, and what it destroys or
        overwrites unattended. Then a safeguard: a dry-run default, a journal/
        lockfile, a quarantine instead of delete, or a report of what it did.
        This project runs unattended rounds, so be specific about its own
        automation.
      not_applicable: |
        No automatic process exists that could destroy or overwrite data. Say so,
        stop.

  log-every-refusal:
    - id: log-every-refusal.1
      applies_when: |
        The repo is a game, an interactive experience, or any system that can
        decline a user's attempted action.
      hunt: |
        Find refusals that are not recorded. Every refusal is feedback about a
        gap between what the player expects and what the system supports -- which
        makes the refusals the single best signal for what to build next. Look for:
        a rejected action that returns a generic message and logs nothing; a guard
        that fires with no record of the input that tripped it; a silent no-op
        (the action simply does nothing, with no message at all); a validation
        that returns a canned string and drops the attempt.
      evidence: |
        A table of refusal sites (file:line), what input triggers each, and
        whether the attempt is recorded. Then instrument the refusals to record
        (a) the verbatim attempted input, (b) the guard that fired, (c) the
        turn/scene context -- in a form a designer can read. Show a real
        captured example after the change.
      not_applicable: |
        The repo cannot decline a user action. Say so, stop.

    - id: log-every-refusal.2
      applies_when: |
        The repo generates responses to user input from templates, rules, or a
        model.
      hunt: |
        Find responses chosen from a fixed set where the CHOICE is not logged.
        When a reply is selected from N options, knowing which one was used (and
        which alternatives existed) is what makes tuning possible. Look for: a
        random or rule-selected message with no record of the branch taken; a
        fallback response indistinguishable from a deliberate one in the logs; a
        model response with no record of the prompt that produced it.
      evidence: |
        The selection site (file:line), the options available, and what is
        recorded today. Then record the branch taken and the input that caused
        it. Show a real captured entry. Do not log anything that would leak a
        secret or a user's private text -- name what you redacted.
      not_applicable: |
        The repo generates no responses from a fixed set. Say so, stop.

    - id: log-every-refusal.3
      applies_when: |
        The repo has a fallback, default, or error path that substitutes a
        generic response.
      hunt: |
        Find generic responses that hide how often they fire. A fallback that is
        never counted looks like it is never used. Look for: a generic reply with
        no counter; an except that returns a canned string silently; a default
        branch at the end of a dispatch; a placeholder chosen when no match is
        found. Each of these is a TODO the code is keeping secret.
      evidence: |
        The fallback (file:line), the condition that reaches it, and the
        instrumentation added (a counter or a log line with the unmatched input).
        Then run or reason through a realistic session and report how often it
        fired -- a real count, or a stated method if you cannot run it.
      not_applicable: |
        No generic fallback path exists. Say so, stop.

    - id: log-every-refusal.4
      applies_when: |
        The repo can fail partway through an operation, leaving the result partial.
      hunt: |
        Find partial outcomes that are reported as success. Look for: a batch
        where some items fail and the operation still reports done; a save that
        persists part of the state and reports success; a multi-step action whose
        later steps failed with no record; an import that skipped bad rows
        silently. The user believes the operation completed; the record says it
        did; the data says otherwise.
      evidence: |
        The operation (file:line), the partial-failure case, and what is recorded
        today (or the proof nothing is). Then record the counts: attempted,
        succeeded, failed -- and surface them in the result. Show a real partial
        run and the record it now produces.
      not_applicable: |
        No operation can fail partway. Say so, stop.

  dead-end-action:
    - id: dead-end-action.1
      applies_when: |
        The repo is a game or interactive experience with actions a user can
        take: commands, menu choices, verbs, or buttons.
      hunt: |
        Find actions that change nothing. Pick actions and trace the state
        before and after: if the delta is empty, it is a dead end. Look for: an
        action returning text but mutating no state; a verb acknowledged and
        ignored; a button that closes a dialog and nothing else; an option that
        leads back to the same screen; a "look" that describes something the
        player cannot interact with.
      evidence: |
        A table: action -> state before -> state after -> verdict. Name the state
        fields you compared (be concrete -- which variables, which file, which
        row). Then either make the action matter or remove it. Show the delta
        after the change, for at least one real action.
      not_applicable: |
        The repo is not interactive. Say so, stop.

    - id: dead-end-action.2
      applies_when: |
        The repo has navigation: rooms, pages, screens, menus, or routes.
      hunt: |
        Find destinations that lead nowhere useful: a room with no exits; a page
        reachable but with no way back; a menu entry that opens an empty screen;
        a route that 404s in normal use; a link to content that no longer exists.
        Walk the actual graph -- enumerate destinations and their outgoing paths,
        and look for orphans and sinks programmatically where the data allows it.
      evidence: |
        The destination (file:line of its definition), the absence of exits
        (show the search or the enumeration), and the fix: add the missing path
        or remove the destination. If you enumerated programmatically, report the
        real counts found -- number of destinations, number of sinks.
      not_applicable: |
        No navigable destinations exist. Say so, stop.

    - id: dead-end-action.3
      applies_when: |
        The repo has interactive objects: items, NPCs, doors, props, or
        elements a user can act on.
      hunt: |
        Find objects that LOOK interactive but are not. This is the cruellest
        dead end, because the interface promised a verb. Look for: a described
        feature with no handler; an object the text implies you can use but that
        rejects everything; an NPC that ignores conversation; a door with no exit
        behind it; a checkbox or control that is disabled for no visible reason.
      evidence: |
        The object (file:line of its definition), the verbs it appears to
        support, and what actually happens for each (show the real response).
        Then either implement the missing interaction or make the interface stop
        implying it. If the object is scenery, say so and make the description
        say so too.
      not_applicable: |
        No interactive objects exist. Say so, stop.

    - id: dead-end-action.4
      applies_when: |
        The repo has a concept of state that users progress through: stages,
        levels, phases, or statuses.
      hunt: |
        Find progress states with no way forward or no way back. Look for: a
        stage whose exit condition can never be satisfied (so a user is stuck); a
        state with no transition defined; a one-way transition where the user
        needs to return; an error state with no recovery. This is where a user
        loses their session.
      evidence: |
        The state (file:line where transitions are defined), the missing
        transition, and a concrete sequence that traps a user in it -- show the
        trace. Then add the missing transition or the recovery path. Confirm by
        walking the fixed sequence.
      not_applicable: |
        No progression states exist. Say so, stop.

  choice-that-doesnt-matter:
    - id: choice-that-doesnt-matter.1
      applies_when: |
        The repo offers a user a choice: a menu, a prompt, options, or branches.
      hunt: |
        Find choices whose options converge. For each choice, follow every option
        forward and compare the outcomes -- if two options lead to the same place
        with the same state, the choice is decoration. Look for: a branch whose
        arms differ only in wording; options that set a field nothing reads; a
        dialog where both buttons do the same thing; a difficulty selection that
        changes no value.
      evidence: |
        The choice (file:line), and for each option, the state and destination it
        leads to -- a table showing the convergence. Then either differentiate
        the options or collapse the choice to one path. Show the differing
        outcomes after the fix, for the options you differentiated.
      not_applicable: |
        The repo offers no user choices. Say so, stop.

    - id: choice-that-doesnt-matter.2
      applies_when: |
        The repo records a user's decision that is later used.
      hunt: |
        Find decisions that are recorded but never consulted. Look for: a
        preference stored and read nowhere; a flag set by the user and never
        branched on; a saved choice surfaced in the UI but ignored in behaviour;
        a config option documented but unimplemented. This is worse than no
        choice at all, because the user believes they configured something.
      evidence: |
        The decision (where it is set, file:line) and the proof nothing reads it
        (show the search). Then implement the behaviour or remove the option.
        State which you chose and why. If it is read only for display, say so --
        and flag that the display implies more than it delivers.
      not_applicable: |
        Every recorded decision is consulted. Show one read site, stop.

    - id: choice-that-doesnt-matter.3
      applies_when: |
        The repo presents options where the outcome depends on something other
        than the choice.
      hunt: |
        Find choices that do not actually control their outcome: a selection
        overridden by a default applied later; a choice whose effect is
        immediately overwritten; an option that changes a label but not the
        behaviour; a preference that only applies if another unrelated condition
        holds. The user's agency is an illusion.
      evidence: |
        The choice (file:line) and the code that overrides it (file:line), with a
        concrete run showing the same outcome for two different selections (paste
        the output). Then make the choice authoritative, or remove it.
      not_applicable: |
        Every choice controls its own outcome. Say so, stop.

    - id: choice-that-doesnt-matter.4
      applies_when: |
        The repo asks for input it could infer, or for a confirmation it always
        ignores.
      hunt: |
        Find prompts that impose a decision with no consequence. Look for: a
        confirmation whose answer is not honoured (both answers proceed); a
        question whose answer is logged and discarded; a required input that is
        always the same value because nothing else works; an option presented
        that the system cannot support. These erode trust in every other prompt.
      evidence: |
        The prompt (file:line), what happens for each answer (show the code path
        or a run), and the fix: honour the answer, or remove the prompt. If the
        prompt is a deliberate speed bump with no branching, say so and state
        what it is for.
      not_applicable: |
        Every prompt's answer affects behaviour. Show one, stop.

  untelegraphed-punishment:
    - id: untelegraphed-punishment.1
      applies_when: |
        The repo can penalise a user: damage, resource loss, a failure, a
        penalty, or a negative consequence.
      hunt: |
        Find consequences the user could not have anticipated. For each punitive
        path, ask: was there a signal before it fired? Look for: instant death or
        failure with no warning; a trap with no tell; a resource drain with no
        visible indicator until it is empty; a rule violation punished without
        ever stating the rule. Fairness is about information, not difficulty.
      evidence: |
        The punitive path (file:line), what the user saw beforehand (name the
        signal, or the absence), and the warning added: a description hint, a
        visible status, a preceding cue. State precisely what the user now sees
        before the consequence. If the source material intends surprise, say so
        and stop -- the goal is fairness, not removing all surprise.
      not_applicable: |
        The repo never penalises a user. Say so, stop.

    - id: untelegraphed-punishment.2
      applies_when: |
        The repo has rules, constraints, or conditions the user must satisfy.
      hunt: |
        Find rules the user can only learn by breaking them. Look for: a
        constraint enforced with an error and never stated anywhere; an
        undocumented limit hit on first use; a prerequisite discoverable only on
        failure; a format requirement shown only in the rejection message. The
        test: is the rule stated somewhere the user would look BEFORE acting?
      evidence: |
        The rule (file:line where enforced), where it is stated (or the proof it
        is not), and where you surfaced it: documentation, an inline hint, a
        placeholder, a description. Quote the before/after user-visible text.
      not_applicable: |
        Every enforced rule is stated where the user acts. Show one, stop.

    - id: untelegraphed-punishment.3
      applies_when: |
        The repo has irreversible or costly actions.
      hunt: |
        Find actions whose cost is not apparent at the moment of choosing. Look
        for: a one-way door presented like any other door; an action consuming a
        limited resource with no cost shown; a choice that locks out an
        alternative with no notice; a permanent change presented as temporary.
        The user should know the price when they pay it.
      evidence: |
        The action (file:line), the cost imposed, and what the user is told at
        the moment of choosing (or the proof they are told nothing). Then add the
        cost to the prompt or the option description -- quote the exact text
        before and after.
      not_applicable: |
        No irreversible or costly actions exist. Say so, stop.

    - id: untelegraphed-punishment.4
      applies_when: |
        The repo has failure states the user can enter: a lost session, an
        unrecoverable error, a forced restart, an invalid state.
      hunt: |
        Find failures the user cannot avoid or recover from once entered. Look
        for: an invalid state reachable by a legal sequence of actions; a failure
        whose cause is only visible in the logs; a state with no way out except
        abandoning progress; a validation on load that rejects a save the user
        legitimately created. The measure is recoverability, not frequency.
      evidence: |
        The failure (file:line), the legal action sequence that reaches it (show
        the trace), and the recovery path added or the cause made visible. If the
        state is genuinely unrecoverable by design, say so and state how the user
        is warned before entering it.
      not_applicable: |
        No unrecoverable user-reachable state exists. Say so, stop.

  reward-pacing:
    - id: reward-pacing.1
      applies_when: |
        The repo is a game or experience with progression, rewards, unlocks, or
        feedback.
      hunt: |
        Find the reward curve by measuring it, not by feel. Enumerate the rewards
        available and the effort each requires, in order. Then look for: a long
        opening stretch with no feedback; a reward granted before the user has
        learned what it is for; a huge gap between rewards late in the curve; a
        reward that trivialises everything after it; the same reward repeated
        with no escalation.
      evidence: |
        A table of rewards in order with the effort to each (state the unit:
        actions, turns, minutes, levels) and the gap between them. Name the
        specific gap or flat stretch that is the problem, with the numbers. Then
        a rebalancing, showing the before/after table. Measure from the real
        definitions, not from an impression.
      not_applicable: |
        The repo has no progression or reward system. Say so, stop.

    - id: reward-pacing.2
      applies_when: |
        The repo provides feedback for user actions: confirmations, sounds,
        effects, messages, acknowledgements.
      hunt: |
        Find actions that receive no acknowledgement. Silent success is
        indistinguishable from a dropped input -- the user repeats the action and
        now has a real problem. Look for: a successful action with no message,
        sound, or visual change; a command that changes state invisibly; a
        purchase or transfer with no receipt; a bulk action with no confirmation
        of scope.
      evidence: |
        The action (file:line), and what the user perceives on success (name the
        signal, or the absence). Then the acknowledgement added. Show a real
        before/after response for at least two actions. If an action is
        deliberately silent for pacing (a fast repeated action), say so and stop.
      not_applicable: |
        Every user action is acknowledged. Name two, stop.

    - id: reward-pacing.3
      applies_when: |
        The repo has difficulty, cost, challenge, or time-gated progression.
      hunt: |
        Find difficulty that is misaligned with its reward: the hardest content
        offering the least payoff, or trivial content offering the most. Look for:
        an optional hard route with no better reward than the easy one; a time
        investment with no proportional return; a risk (a chance of loss) with no
        compensating benefit; the best reward available from the safest action.
      evidence: |
        A table: challenge (with its measured or defined cost) vs reward for each
        path. Name the inversion with the numbers. Then an adjustment, showing
        the before/after table. Be explicit about which you changed -- the cost
        or the reward.
      not_applicable: |
        No difficulty or cost system exists. Say so, stop.

    - id: reward-pacing.4
      applies_when: |
        The repo ends: a session, a run, a level, a match, or a project.
      hunt: |
        Find endings that give no accounting. A summary is where a user forms
        their memory of the experience; its absence makes the whole session feel
        pointless. Look for: an end with no recap of what happened; no total of
        what was earned or lost; no acknowledgement of the achievement; the state
        simply stopping; a result screen showing only a pass/fail.
      evidence: |
        The ending path (file:line), what the user sees at the end (or the proof
        they see nothing), and the summary added: what was done, what was earned,
        and what is next. Show the actual end-state output before and after. If
        the repo has no ending, say so and stop.
      not_applicable: |
        The repo has no session or run boundary. Say so, stop.

  world-inconsistency:
    - id: world-inconsistency.1
      applies_when: |
        The repo maintains a fictional, simulated, or described world: a game
        world, a narrative, a dataset with an internal story, or a simulated
        system.
      hunt: |
        Find facts that contradict each other across the world's sources. Build a
        list of asserted facts (from descriptions, data, dialogue, documentation)
        and check them against each other: a character described one way and
        behaving another; a location's attributes differing between sources; a
        quantity stated twice with different values; a timeline that cannot be
        ordered consistently. Contradiction is the fastest way to break a user's
        immersion.
      evidence: |
        A table of the contradicting statements with their file:line (or data
        rows), showing both sides verbatim and the conflict. Then fix one side --
        decide which is authoritative and say why. Give the before/after text.
      not_applicable: |
        The repo maintains no described world. Say so, stop.

    - id: world-inconsistency.2
      applies_when: |
        The repo generates content procedurally or from templates: names,
        descriptions, encounters, responses.
      hunt: |
        Find generated content that contradicts the established world. Look for:
        a generated description that does not fit the location's established
        character; an encounter inappropriate for the region or level; a name
        that breaks the world's naming convention; output that references
        something the world does not contain; a tone that clashes with the
        surrounding text.
      evidence: |
        The generator (file:line), a real generated sample that conflicts, and
        the world fact it violates (with its source). Then the constraint added
        to the generator, plus a new sample showing it now fits. Report actual
        generated output before and after -- do not paraphrase.
      not_applicable: |
        The repo generates no world content. Say so, stop.

    - id: world-inconsistency.3
      applies_when: |
        The repo tracks world state that changes over the user's session: a
        location, an inventory, a time, a relationship, a status.
      hunt: |
        Find state that contradicts what is being described. Look for: a
        description that does not reflect the current state (saying a room is
        empty when it is not); a user's position in the text disagreeing with the
        tracked position; time advancing in narration but not in the model (or the
        reverse); an entity described as present while tracked as elsewhere; a
        dead or removed thing still referenced.
      evidence: |
        The description site and the state it should reflect (file:line each),
        and a concrete sequence where they diverge -- show the state values and
        the rendered text side by side. Then fix the description to take its truth
        from the state. Show a real run after the fix.
      not_applicable: |
        No tracked world state exists. Say so, stop.

    - id: world-inconsistency.4
      applies_when: |
        The repo has content written at different times, or by different authors,
        or generated by different code paths.
      hunt: |
        Find seams where the world's voice or rules shift. Look for: two code
        paths producing different phrasing for the same event; a naming
        convention that changes in part of the content; the same concept referred
        to by different terms; a rule enforced in one path and not another (does
        a door that needs a key in one handler ignore it in another?). Seams are
        where a user notices the machinery.
      evidence: |
        Both sides of each seam (file:line each) with the differing text or
        behaviour quoted. Then unify them -- name the convention you chose. If the
        variation is deliberate (different characters, different regions), say so
        and stop.
      not_applicable: |
        The world's content has one consistent source. Say so, stop.

  inert-npc:
    - id: inert-npc.1
      applies_when: |
        The repo has non-player entities: characters, agents, bots, or simulated
        actors.
      hunt: |
        Find entities that are described as active but behave passively. Look
        for: a character with dialogue but no behaviour; an entity that never
        acts except when addressed; a described as moving/working/scheming while
        the code has it stationary; an entity whose state never changes over a
        session; an actor that ignores events happening around it.
      evidence: |
        The entity (file:line of its definition and its update logic), what the
        description implies it does, and what it actually does across a session
        (show the real trace or the code path that never branches on world
        events). Then give it at least one autonomous behaviour, and show it
        firing in a real run.
      not_applicable: |
        The repo has no non-player entities. Say so, stop.

    - id: inert-npc.2
      applies_when: |
        The repo lets a user interact with non-player entities: talk, ask,
        trade, attack, help.
      hunt: |
        Find entities that respond but do not remember or react. Look for: a
        character answering the same way regardless of prior interactions; a
        conversation that resets each turn; an entity that does not react to being
        helped or harmed; an NPC whose response ignores who is speaking to it; a
        merchant whose stock never reflects what was bought or sold.
      evidence: |
        The interaction handler (file:line), a real sequence showing the
        non-reaction (paste the two identical or contradictory responses), and the
        state that should have changed. Then wire the response to that state and
        show the same sequence producing a different, appropriate reply.
      not_applicable: |
        No interaction with non-player entities exists. Say so, stop.

    - id: inert-npc.3
      applies_when: |
        The repo simulates a population, group, or set of entities that should
        behave as a whole.
      hunt: |
        Find groups that are described as having collective behaviour but are
        inert. Look for: a faction or crowd with no aggregate behaviour; a
        settlement whose population never changes; a market whose prices never
        move; a group that does not react to an event affecting it. The failure is
        a world that is scenery rather than a system.
      evidence: |
        The group (file:line), the behaviour implied (quote the description or
        docs), and the proof no such behaviour exists (show there is no update
        path). Then add one aggregate behaviour with a visible effect, and show
        it running. Keep it small -- one real behaviour beats a system.
      not_applicable: |
        The repo simulates no groups. Say so, stop.

    - id: inert-npc.4
      applies_when: |
        The repo describes entities with attributes, goals, or states that are
        never used.
      hunt: |
        Find entities defined richly but consumed shallowly. Look for: a data
        model with many fields that no code reads; a character with a described
        goal that no logic pursues; an attribute set at creation and never
        consulted; a relationship defined and never referenced. The description
        promises depth the code does not honour.
      evidence: |
        The entity (file:line of its definition), a field-by-field table of which
        are read anywhere (with the search as evidence), and the verdict: use the
        unused fields in behaviour, or remove them from the description so it
        stops promising. State which per field.
      not_applicable: |
        Every described attribute is used. Show one, stop.

  missing-architecture-note:
    - id: missing-architecture-note.1
      applies_when: |
        The repo has more than a handful of modules, or a non-obvious structure.
      hunt: |
        Find the architecture that exists only in the author's head. Look for: a
        repo with no README explaining the layout; a directory named after a
        concept with no explanation of what belongs in it; a module whose
        relationship to others is not evident from its name; an entry point that
        is not obvious from the file listing; a build/run instruction that exists
        only in a chat log.
      evidence: |
        Write the missing document -- but only what you can VERIFY from the code:
        the actual entry point (file:line), the actual data flow (name the real
        modules in the real order), and the rules a new contributor must not
        break (cite where each is enforced). Mark every inference you could not
        verify as an inference. Do not invent intent.
      not_applicable: |
        The architecture is documented and current. Point at the document, stop.

    - id: missing-architecture-note.2
      applies_when: |
        The repo requires setup, build, or run steps.
      hunt: |
        Find instructions that are missing, wrong, or incomplete. Actually run
        the setup from the documented steps in a clean copy and see where it
        fails. Look for: a README that omits a required step; a dependency not
        mentioned; a documented command that no longer works; an environment
        variable required but undocumented; a documented port that is wrong.
      evidence: |
        The documented steps (quote them, with file:line), the step where a clean
        run actually failed (paste the real error), and the corrected
        instructions. Report the command output you obtained -- do not describe
        what would happen. If the documented steps worked unchanged, say so.
      not_applicable: |
        The repo needs no setup, or the documented steps work. Say which, stop.

    - id: missing-architecture-note.3
      applies_when: |
        The repo has conventions a contributor must follow: naming, structure,
        testing, or commit rules.
      hunt: |
        Find conventions enforced by habit but not written, or written but not
        enforced. Look for: a consistent pattern in the code with no document
        explaining it (a discoverable convention is still a missing note if
        breaking it causes a silent failure); a documented rule that the code
        violates somewhere; a test convention (where tests live, how they are
        named) that a newcomer would not guess.
      evidence: |
        The convention (cite at least two real instances with file:line), whether
        it is documented, and the note written -- including WHY the convention
        exists (name the failure that breaking it causes, if you can determine
        it). If you cannot determine a why, say so rather than inventing one.
      not_applicable: |
        Conventions are documented and followed, or there are none. Say so, stop.

    - id: missing-architecture-note.4
      applies_when: |
        The repo has surprising decisions: an unusual approach, a workaround, or
        a deviation from the obvious.
      hunt: |
        Find code that will make the next reader ask "why on earth is it done
        this way?" and cannot answer. Look for: a workaround with no comment; a
        deliberately odd structure; a dependency pinned for a reason nobody
        wrote down; a guard that looks redundant; a hand-rolled implementation
        where a library exists. Each is a landmine for a future contributor --
        and for a future loop round that might "simplify" it away.
      evidence: |
        The decision (file:line), the evidence you found for WHY it is that way
        (git log, a linked issue, a test that pins it, a comment elsewhere), and
        the note written in place. If you cannot find the reason, say so
        explicitly and describe the failure mode that a change would risk -- do
        not invent a rationale.
      not_applicable: |
        No surprising, unexplained decisions exist. Say so, stop.

  misleading-name:
    - id: misleading-name.1
      applies_when: |
        The repo has functions, methods, or variables whose names assert what they
        do.
      hunt: |
        Read the name, then read the body, and find where they disagree. Look for:
        a getter that mutates; a "validate" that also writes; a "count" that
        returns something other than a count; an "is_ready" that has a side
        effect; an "update" that also deletes; a name implying a cheap operation
        that performs IO. The name is the interface -- when it lies, every caller
        is reasoning from a false premise.
      evidence: |
        A table: symbol, file:line, what the name promises, what it actually does
        (name the surprising side effect or return), and the verdict. Then rename
        to match behaviour, or split the function so the name is true. Prefer
        correctness: if callers depend on the side effect, keep the effect and
        name it honestly.
      not_applicable: |
        No misleading names found in the modules you read. State which you read,
        stop.

    - id: misleading-name.2
      applies_when: |
        The repo has types, classes, or data structures.
      hunt: |
        Find structures whose shape contradicts their name. Look for: a "List" or
        "Set" that is a string; a "Map"/"Dict" that is a list; an optional field
        named as if always present; a "Config" that also holds mutable runtime
        state; a "Result" that can be an error; a "User" carrying unrelated data.
        These names propagate into every variable declaration and every reader's
        mental model.
      evidence: |
        The type (file:line), what the name implies, its actual shape or contents
        (show the definition), and the rename or restructure applied. Update the
        call sites too and show the gate passing. If a rename would break an
        external contract, say so and document the honest meaning instead.
      not_applicable: |
        No contradictory type names found. State what you reviewed, stop.

    - id: misleading-name.3
      applies_when: |
        The repo has identifiers in a language with type annotations, comments, or
        documented signatures.
      hunt: |
        Find annotations that disagree with reality: a parameter typed as optional
        but dereferenced unconditionally; a return type that does not include a
        value the function actually returns (None on a failure path); an Any that
        hides a real type; a mutable default argument shared across calls; a
        signature documented as non-throwing that raises. The annotation is a
        promise the runtime does not enforce.
      evidence: |
        The annotation (file:line) and the code that violates it (file:line), with
        the path that produces the mismatch shown. Then correct the annotation or
        the behaviour -- prefer fixing the behaviour if callers rely on the
        annotated contract. Note: `typing` checks may catch some of these, but
        report what YOU verified by reading the paths.
      not_applicable: |
        The language has no type annotations, or all annotations are accurate.
        Say so, stop.

    - id: misleading-name.4
      applies_when: |
        The repo has directories, modules, files, or comments that describe their
        contents.
      hunt: |
        Find descriptions that no longer match. Look for: a module named for a
        concern it no longer handles; a directory containing unrelated files; a
        docstring describing an older signature; a comment asserting behaviour
        that changed; a filename implying a format it no longer uses; a "utils" or
        "helpers" module holding domain logic. A stale description costs every
        future reader -- and it misleads an automated round too.
      evidence: |
        The description (file:line) and the reality (what is actually there --
        name the contradicting contents). Then correct the description, rename, or
        move the misfiled items. Show the gate passing after any move. Where the
        comment describes intent rather than behaviour, keep the intent and
        correct only the false claim.
      not_applicable: |
        Descriptions match their contents. Show one you checked, stop.

  unsafe-to-modify:
    - id: unsafe-to-modify.1
      applies_when: |
        The repo has code that many other parts depend on: a shared function,
        base class, schema, or format.
      hunt: |
        Identify the code a change would ripple through, and explain what makes it
        unsafe to touch. Look for: a function with many callers (count them); a
        data format read by code outside this repo; a base class whose subclasses
        assume behaviour; a constant compared elsewhere; a public API. The
        deliverable is a map of what a change here breaks.
      evidence: |
        The symbol (file:line), the caller count and their locations, and the
        specific assumption each makes about it (quote it). Then write the warning
        where the next reader will see it (a docstring/comment) naming the blast
        radius. If a safe change is possible, say what it is.
      not_applicable: |
        No widely-depended-upon symbol exists. Show your caller counts, stop.

    - id: unsafe-to-modify.2
      applies_when: |
        The repo has tests that pin current behaviour.
      hunt: |
        Find behaviour that LOOKS like a bug but is pinned by a test -- so
        "fixing" it breaks the build. Look for: an odd-looking value asserted
        exactly; a test name implying a workaround; a test asserting a quirk with
        an apologetic comment; a boundary case pinned deliberately. These are
        landmines for an automated round: the gate will fail and the round will
        revert without understanding why.
      evidence: |
        The behaviour (file:line) and the test pinning it (file:line, quote the
        assertion). Then determine WHY -- read the git log, the comment, and
        surrounding code -- and write the reason at the assertion so the next
        round does not undo it. If you cannot determine the reason, say so
        explicitly and record that it is pinned-but-unexplained. Do NOT just make
        the test pass.
      not_applicable: |
        No tests pin surprising behaviour. Say so, stop.

    - id: unsafe-to-modify.3
      applies_when: |
        The repo has generated files, vendored code, or file format contracts.
      hunt: |
        Find files that must not be hand-edited. Look for: a generated file with
        no header saying so; vendored third-party code in the tree; a schema or
        migration applied elsewhere; a lockfile edited by hand; a build output
        committed. A change here is overwritten on the next generation, or
        silently wrong -- and an automated round is exactly the thing that would
        try.
      evidence: |
        The file (path + the generator, file:line of the generator if present),
        the evidence it is generated or vendored, and a clear marker added: a
        header comment naming the generator and the command to regenerate. If the
        file is checked in deliberately and hand-maintained, say so instead.
      not_applicable: |
        No generated, vendored, or contract files exist. Say so, stop.

    - id: unsafe-to-modify.4
      applies_when: |
        The repo has invariants that are not enforced by types or tests: ordering,
        uniqueness, a required cache, a lock, a required initialisation.
      hunt: |
        Find invariants a modifier could silently break. Look for: a function that
        MUST be called before another (with no check); a collection assumed sorted
        or unique; a cache that must be populated first; a state machine that
        must be initialised; a lock that must be held. Nothing in the code stops a
        change from violating them, and the symptom appears far away.
      evidence: |
        The invariant (where it is relied on, file:line), what enforces it today
        (or the honest absence), and the failure if broken (name the symptom and
        how far from the cause it appears). Then enforce it -- an assertion with a
        message, a check, a type -- or document it prominently at the point of
        reliance.
      not_applicable: |
        All invariants are enforced by types, tests, or checks. Show one, stop.

  lying-comment:
    - id: lying-comment.1
      applies_when: |
        The repo has comments that describe what the code does.
      hunt: |
        Read each comment, then read the code, and find where the comment is
        false. Look for: a comment describing behaviour that was changed; a
        comment naming a parameter or return value that no longer matches; a
        comment saying a value cannot be null where it can; a documented
        complexity or bound that is wrong; a "this is safe because" claim that is
        now unjustified. A false comment is worse than no comment: it stops the
        reader from checking.
      evidence: |
        A table: comment, file:line, the code that contradicts it (file:line,
        quote both), and the correction made. Either fix the comment to match the
        code, or fix the code if the comment states the intended behaviour -- say
        which and why. Where the comment states INTENT that the code fails to
        honour, that is a finding in its own right: report it as such.
      not_applicable: |
        No lying comments found in what you read. State which files you reviewed,
        stop.

    - id: lying-comment.2
      applies_when: |
        The repo has TODO, FIXME, HACK, XXX, or NOTE markers.
      hunt: |
        Find markers that are stale -- describing work already done, or a problem
        already fixed elsewhere. Look for: a TODO for a feature that now exists; a
        FIXME on a line that was rewritten; a HACK explaining a workaround that
        no longer applies (the dependency was fixed); a "temporary" that is years
        old (check git blame for the date). Stale markers teach readers to ignore
        all markers.
      evidence: |
        Each marker (file:line, quote it), its age (git blame output), and its
        current status. Then remove the resolved ones and keep the live ones. For
        anything you keep, state whether it still has a reason -- and if it does
        not, that is the finding to remove.
      not_applicable: |
        No TODO/FIXME/HACK markers exist, or all are current. Say which, stop.

    - id: lying-comment.3
      applies_when: |
        The repo has documentation outside the code: README, docs directory, or
        docstrings.
      hunt: |
        Find documented behaviour that the code does not implement, or implements
        differently. Pick the claims a user would rely on: a command's flags, an
        API's response shape, a configuration key's effect, a limit's value, a
        stated guarantee. VERIFY each against the code or by running it -- do not
        eyeball it.
      evidence: |
        The claim (quote it, with file:line), the code's actual behaviour (show
        the code or run it), and the discrepancy. Then correct the documentation
        or the code -- prefer the code when the document describes intent. Do not
        silently change the docs to match a bug; if the code is wrong, say so.
      not_applicable: |
        No external documentation exists. Say so, stop.

    - id: lying-comment.4
      applies_when: |
        The repo has comments explaining WHY a decision was made: a workaround, a
        constraint, a deliberate choice.
      hunt: |
        Find rationale comments whose stated reason no longer holds. These are the
        most dangerous kind, because they justify code that looks wrong -- and a
        future modifier will delete the code once the reason is disproved. Look
        for: "this is needed because X" where X was fixed elsewhere; a comment
        justifying a workaround for a dependency version no longer used; a comment
        citing a bug that is closed; a "do not change this" with no reason.
      evidence: |
        The comment (file:line, quote it), the stated reason, the evidence about
        whether it still holds (check the dependency version, the referenced bug,
        the surrounding code), and the verdict. Then remove the comment and the
        now-pointless code, or update the reason. If the reason DOES still hold,
        strengthen the comment with the evidence so nobody re-litigates it.
      not_applicable: |
        No rationale comments found. State what you reviewed, stop.
