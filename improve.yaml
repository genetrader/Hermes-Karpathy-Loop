    probe: http://127.0.0.1:8823/health
    start: cd "C:/Users/gene/ANDROID NOTES LIKE GENSPARK/server" && .venv/Scripts/python.exe -m app.main
    note: /health returns 401 without the SB_API_TOKEN bearer; a 401 here means the server IS up.
