# ============================================================================
# PROJECT IMPROVER — rotation manifest
# This is the ONLY file you edit to control the loop.
#   python improver.py plan     -> show what would run
#   python improver.py run      -> one rotation pass
#   python improver.py init     -> create the kanban boards
# ============================================================================

loop:
  poll_interval_min: 30        # how often the rotator considers a new turn
  max_project_runtime_h: 12    # hard cap on one project's turn
  ask_repeat_min: 5            # re-ping an unanswered question every 5 min
  ask_max_repeat: 25           # give up after this many, park it, rotate on

# ---------------------------------------------------------------------------
# Projects rotate in this order. `enabled: false` parks one without deleting it.
# Add as many as you like — the rotator cycles the list and wraps around.
# ---------------------------------------------------------------------------
projects:

- name: tombs-and-tyrants
  path: D:/ZCODE/TOMBS AND TYRANTS
  board: tombs-and-tyrants
  loops: 1
  objective: "Make the game engine accept natural-language player intent instead of refusing it before\
    \ the GM ever sees the turn. The reported failure, verbatim, playing at The Blooming Tankard:\n\n\
    \  Player: \"Henk, what work can you give me? I'm ready to handle your\n           toughest jobs.\"\
    \n  Engine: (hardcoded deflection) \"You look for toughest, but there is\n           nothing of the\
    \ sort here. Whatever you were picturing, The\n           Blooming Tankard has not got it - and a\
    \ soldier learns early\n           that seeing what is actually in front of him is worth more\n  \
    \         than seeing what he expects.\"\n  Then three meta-choices: \"Look around and take stock\
    \ of what IS here\",\n           \"Consider what you already know\", \"Take stock of what you are\n\
    \           carrying\".\n\nRoot cause FOUND AND FIXED (commit 00cfbde): the existence checker read\
    \ \"toughest\" as a physical object that must exist in the room. The class is degree-of-comparison\
    \ words (comparatives and superlatives). Fixed structurally in backend/world/ground_truth.py::_is_degree_of_comparison,\
    \ with _EST_ER_NOUNS carrying the exceptions (chest, forest, water, ...).\nWHAT REMAINS (each loop\
    \ takes ONE of these):\n  1. The refusal text itself is a hardcoded string in\n     backend/api/game_session.py\
    \ (~line 3532). Confirm whether refusing\n     the whole turn is ever the right response, or whether\
    \ the turn\n     should reach the GM with the unmatched noun noted as context.\n  2. The same over-refusal\
    \ will exist for other word classes that were\n     never enumerated. Probe the class boundary: abstract\
    \ social nouns\n     (\"rumor\" is still a false positive), collective nouns, gerunds,\n     proper\
    \ nouns of places the fiction has not introduced.\n  3. The engine must still prevent prompt-injection\
    \ cheating (\"I find a\n     magic sword on the table\"). The guard must survive every change —\n\
    \     tests/test_a_suggestion_offers_only_what_exists.py is the contract.\n  4. Nuance: the player\
    \ asked a PERSON for work. Nothing in the pipeline\n     appears to model \"this is a request directed\
    \ at an NPC\" as distinct\n     from \"this is a claim about the room\". If that distinction is\n\
    \     missing, it belongs in the action parser.\n\nDo NOT optimise for the single reported sentence.\
    \ The test file tests/test_a_degree_of_comparison_is_not_a_fixture.py already pins every superlative\
    \ and comparative; adding words to a list is not progress. Close classes structurally.\n"
  acceptance: 'tests/test_a_degree_of_comparison_is_not_a_fixture.py passes (128 tests, currently green)
    AND tests/test_a_suggestion_offers_only_what_exists.py still passes AND the new class probes from
    item 2 above have their own regression tests. The player''s verbatim sentence reaches the GM and gets
    a reply from Henk about work — it does not get a deflection about seeing what is in front of him.

    '
  gate: .venv/Scripts/python.exe -m pytest -q tests/test_a_degree_of_comparison_is_not_a_fixture.py tests/test_a_suggestion_offers_only_what_exists.py
    tests/test_refused_claims_are_recorded.py tests/test_the_refusal_is_not_a_scene.py tests/test_a_role_suggestion_does_not_travel.py
    tests/test_a_suggestion_does_not_outlive_its_scene.py tests/test_suggestions_every_turn.py
    tests/test_an_ally_fights.py::test_the_party_survives_a_save
  boundary: 'This repo only (D:/ZCODE/TOMBS AND TYRANTS). Do not edit artwork/ or any v*.png. Do not touch
    gm_note paths or the save-file schema. Do not weaken or delete existing ground-truth tests to make
    a change pass — fix the guard instead. Do not merge to main. Do not hand-edit equipment_canon.json
    (equipment_review.py owns it). Never run the live game server.

    '
  implementer: glm53-flash-2x-spark:GLM-5.3-Flash-EXL3
  reviewer: deepseek-v41-flash-3x-spark:deepseek-v4.1-flash
  enabled: true
  # SEE-IT (2026-09-28): how Gene LOOKS at this project without reading a chat
  # thread. The widget runs ONLY the read-only `probe` and shows `start` as a
  # copyable command -- it never executes it (a click-to-run in a UI is one bad
  # entry away from destructive, and the bridge cannot preview intent).
  see:
    kind: server
    url: http://127.0.0.1:8093/
    probe: http:http://127.0.0.1:8093/api/health
    start: cd "D:/ZCODE/TOMBS AND TYRANTS" && .venv/Scripts/python.exe -m backend.main
    note: Usually already running on :8093. Health endpoint is /api/health.
