- name: ai-consultancy-website
  path: C:/Users/gene/ai-consultancy
  board: ai-consultancy-website
  loops: 1
  gate: npm run lint && npm run build
  objective: "Build out Gene's AI consultancy marketing site (Next.js 15 App Router + TypeScript,
    Tailwind/PostCSS, eslint flat config). This is the public front door for the SMB AI consulting
    offers: it must state clearly what is offered, to whom, at what price band, and make the next
    step (book a call / request an audit) obvious and frictionless. Improve conversion structure,
    copy honesty (never promise outcomes the delivery model cannot support), accessibility
    (contrast, focus order, semantic landmarks), SEO/metadata, and Core Web Vitals. No test suite
    exists yet, so the gate is lint + production build; add focused tests only where they earn it."
  enabled: true
  see:
    kind: built-site
    url: http://127.0.0.1:3000/
    probe: tcp:3000
    start: cd "C:/Users/gene/ai-consultancy" && npm run dev
    note: No git remote configured, so the round push is skipped by design.
